    function drawMachineBuilding(m, lv) {
      const b = m.body;
      const owned = lv >= 1;
      const look = machineLook(lv);
      const ws = state.workshops[m.id];
      const busy = owned && ws && (ws.processing.length || ws.queue.length);
      const D = 38;
      const H = 28;
      const x = b.x, y = b.y, w = b.w, h = b.h;
      const tNow = performance.now();

      // Heavy ground shadow — reads as a volume, not a sticker
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.ellipse(x + w / 2 + 14, y + h + 8, w * 0.62, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      // Right side wall (much darker — depth cue)
      ctx.fillStyle = look.side;
      ctx.beginPath();
      ctx.moveTo(x + w, y);
      ctx.lineTo(x + w + D * 0.7, y - H);
      ctx.lineTo(x + w + D * 0.7, y + h - H);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Top slab (lighter)
      ctx.fillStyle = look.slab;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + D * 0.7, y - H);
      ctx.lineTo(x + w + D * 0.7, y - H);
      ctx.lineTo(x + w, y);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = look.slabHi;
      ctx.beginPath();
      ctx.moveTo(x + 4, y + 2);
      ctx.lineTo(x + D * 0.55, y - H + 4);
      ctx.lineTo(x + w * 0.55, y - H + 4);
      ctx.lineTo(x + w * 0.45, y + 2);
      ctx.closePath();
      ctx.fill();

      // Front wall
      const front = ctx.createLinearGradient(x, y, x + w, y);
      front.addColorStop(0, look.front0);
      front.addColorStop(0.35, look.front1);
      front.addColorStop(1, look.front2);
      ctx.fillStyle = front;
      roundRect(x, y, w, h, 5);
      ctx.fill();
      // Left edge highlight
      ctx.fillStyle = look.edge;
      ctx.fillRect(x + 2, y + 4, 5, h - 8);
      ctx.strokeStyle = look.stroke;
      ctx.lineWidth = lv >= 3 ? 2.8 : 2;
      roundRect(x, y, w, h, 5);
      ctx.stroke();

      // Vertical plank / brick hints on front
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1;
      const strips = lv >= 2 ? 5 : 4;
      for (let i = 1; i < strips; i++) {
        const px = x + (w * i) / strips;
        ctx.beginPath();
        ctx.moveTo(px, y + 8);
        ctx.lineTo(px, y + h - 10);
        ctx.stroke();
      }
      if (lv >= 2) {
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        for (let row = 1; row < 3; row++) {
          const py = y + 10 + row * ((h - 20) / 3);
          ctx.beginPath();
          ctx.moveTo(x + 8, py);
          ctx.lineTo(x + w - 8, py);
          ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(255,230,180,0.28)';
      for (let i = 1; i < strips; i++) {
        const px = x + (w * i) / strips;
        ctx.beginPath();
        ctx.arc(px, y + 12, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px, y + h - 16, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }

      // Factory roof: flat cap + pipes (no house peak)
      const roofTopY = y - H;
      ctx.fillStyle = look.roofTop;
      ctx.beginPath();
      ctx.moveTo(x + 6, y + 2);
      ctx.lineTo(x + D * 0.55, roofTopY + 4);
      ctx.lineTo(x + w + D * 0.55, roofTopY + 4);
      ctx.lineTo(x + w - 6, y + 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = look.roofStroke;
      ctx.lineWidth = lv >= 3 ? 2 : 1.4;
      ctx.stroke();
      ctx.fillStyle = look.front1;
      ctx.fillRect(x + 8, y - 6, w - 16, 7);
      if (look.trim) {
        ctx.strokeStyle = lv >= 3 ? 'rgba(253,224,140,0.7)' : 'rgba(200,170,120,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 10, y - 6);
        ctx.lineTo(x + w - 10, y - 6);
        ctx.stroke();
      }

      const drawPipe = (cx0, cy0, hgt, smokePhase) => {
        ctx.fillStyle = look.chimSide;
        ctx.fillRect(cx0 + 9, cy0 - hgt, 7, hgt + 4);
        ctx.fillStyle = look.chimFront;
        ctx.fillRect(cx0, cy0 - hgt, 10, hgt + 4);
        ctx.fillStyle = lv >= 2 ? look.roofTop : '#3a3028';
        ctx.fillRect(cx0 - 2, cy0 - hgt - 5, 14, 6);
        if (busy) {
          const t = tNow / 220 + smokePhase;
          ctx.fillStyle = `rgba(200,210,230,${0.28 + 0.22 * Math.sin(t)})`;
          ctx.beginPath();
          ctx.arc(cx0 + 5, cy0 - hgt - 10 - Math.sin(t) * 6, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      };
      drawPipe(x + w * 0.62, roofTopY + 2, 28, 0);
      if (look.chimneys >= 2) drawPipe(x + w * 0.38, roofTopY + 4, 22, 1.3);

      // Side lanterns (lv2+)
      if (look.lanterns) {
        const glow = 0.45 + 0.35 * Math.sin(tNow / 280);
        [[x + 6, y + 18], [x + w - 10, y + 18]].forEach(([lx, ly]) => {
          ctx.fillStyle = '#2a1810';
          ctx.fillRect(lx, ly - 10, 3, 12);
          ctx.fillStyle = `rgba(253,224,71,${glow})`;
          ctx.beginPath();
          ctx.arc(lx + 1.5, ly - 14, 5, 0, Math.PI * 2);
          ctx.fill();
          if (lv >= 3) {
            ctx.fillStyle = `rgba(253,186,116,${0.2 + glow * 0.25})`;
            ctx.beginPath();
            ctx.arc(lx + 1.5, ly - 14, 10, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      // Small roof banner (max level)
      if (look.banner) {
        const bx = x + w * 0.12;
        const by = y - H - 8;
        ctx.fillStyle = '#1a0a12';
        ctx.fillRect(bx, by - 18, 3, 22);
        ctx.fillStyle = '#e879a8';
        ctx.beginPath();
        ctx.moveTo(bx + 3, by - 18);
        ctx.lineTo(bx + 22, by - 12);
        ctx.lineTo(bx + 3, by - 6);
        ctx.closePath();
        ctx.fill();
      }

      // Recessed machine window
      const wx = x + w * 0.2, wy = y + h * 0.28, ww = w * 0.58, wh = h * 0.44;
      if (look.winGlow && owned) {
        const pulse = 0.2 + 0.15 * Math.sin(tNow / 320);
        ctx.fillStyle = `rgba(251,191,36,${pulse})`;
        roundRect(wx - 4, wy - 4, ww + 8, wh + 8, 6);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(8,4,2,0.78)';
      roundRect(wx, wy, ww, wh, 4);
      ctx.fill();
      ctx.strokeStyle = look.winStroke;
      ctx.lineWidth = lv >= 3 ? 3.2 : 2.5;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.strokeRect(wx + 3, wy + 3, ww - 6, wh - 6);
      if (lv >= 2) {
        // Cross muntins — more “machine” than open hole
        ctx.strokeStyle = 'rgba(255,220,160,0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(wx + ww / 2, wy + 4);
        ctx.lineTo(wx + ww / 2, wy + wh - 4);
        ctx.moveTo(wx + 4, wy + wh / 2);
        ctx.lineTo(wx + ww - 4, wy + wh / 2);
        ctx.stroke();
      }

      // Front counter ledge (sticks toward the shelf)
      ctx.fillStyle = owned ? '#1a0e08' : '#120e0a';
      ctx.fillRect(x + 4, y + h - 2, w - 8 + D * 0.15, 12);
      ctx.fillStyle = look.counter;
      roundRect(x + 2, y + h - 14, w - 4, 14, 3);
      ctx.fill();
      ctx.fillStyle = owned ? 'rgba(255,240,200,0.35)' : 'rgba(255,255,255,0.08)';
      ctx.fillRect(x + 6, y + h - 12, w - 12, 3);
      ctx.strokeStyle = look.counterEdge;
      ctx.lineWidth = 1.5;
      roundRect(x + 2, y + h - 14, w - 4, 14, 3);
      ctx.stroke();
      if (lv >= 3) {
        ctx.fillStyle = 'rgba(253,224,140,0.55)';
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(x + 16 + i * ((w - 28) / 2), y + h - 7, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Property sign in window — parallel marks / equal / right angle (no gem preview)
      ctx.save();
      ctx.globalAlpha = owned ? 1 : 0.45;
      drawMachineSign(m.id, x + w / 2, wy + wh * 0.52, owned, owned ? (lv >= 3 ? 1.2 : 1.05) : 0.9);
      ctx.restore();

      // Roof mark / stars sit on the factory cap, not a house peak
      if (look.crystal) {
        const pulse = 0.7 + 0.3 * Math.sin(tNow / 260);
        ctx.save();
        ctx.globalAlpha = pulse;
        drawMachineSign(m.id, x + w / 2 + D * 0.18, roofTopY - 18, true, 0.45);
        ctx.restore();
      }

      if (lv >= 1) {
        ctx.fillStyle = lv >= 4 ? '#fde68a' : '#ffe08a';
        ctx.font = '800 13px Outfit, sans-serif';
        ctx.textAlign = 'center';
        const stars = lv <= 3 ? '★'.repeat(lv) : '★' + lv;
        ctx.fillText(stars, x + w / 2 + D * 0.18, roofTopY - (look.crystal ? 32 : 14));
        ctx.textAlign = 'left';
      }
    }

    function drawPad(r, label, hot, fullWarn) {
      if (fullWarn) {
        const pulse = warnPulse();
        ctx.fillStyle = `rgba(220,40,60,${0.28 + pulse * 0.4})`;
        roundRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8, 12);
        ctx.fill();
        ctx.strokeStyle = `rgba(251,113,133,${0.55 + pulse * 0.45})`;
        ctx.lineWidth = 3.5;
        roundRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8, 12);
        ctx.stroke();
      }
      drawShelfBoard(r, hot || fullWarn);
      ctx.fillStyle = fullWarn
        ? `rgba(254,202,202,${0.75 + 0.25 * warnPulse()})`
        : (hot ? 'rgba(253,230,138,0.85)' : 'rgba(240,195,106,0.45)');
      ctx.font = '800 14px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, r.x + r.w / 2, r.y + 16);
      ctx.textAlign = 'left';
    }

    function drawUpgradePad(m) {
      const lv = mLv(m.id);
      if (lv < 1 || lv >= mMax(m)) return;
      const r = m.upgrade;
      const hot = inRect(state.player, r);
      const cost = m.costs[lv];
      const can = state.gold >= cost;
      const pulse = 0.45 + 0.55 * Math.sin(performance.now() / 220);
      const leftCol = m.body.x < 400;
      const shelf = m.input;

      // Ground tether: pad → front shelf so ownership reads at a glance
      const midY = r.y + r.h * 0.72;
      const x0 = leftCol ? r.x + r.w : r.x;
      const x1 = leftCol ? shelf.x : shelf.x + shelf.w;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x0, midY);
      ctx.lineTo(x1, midY);
      ctx.stroke();
      ctx.strokeStyle = can ? 'rgba(94,234,212,0.55)' : 'rgba(148,163,184,0.45)';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(x0, midY);
      ctx.lineTo(x1, midY);
      ctx.stroke();
      ctx.lineCap = 'butt';

      // Ground plate
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(r.x + r.w / 2 + 2, r.y + r.h - 1, r.w * 0.48, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      g.addColorStop(0, can ? '#5eead4' : '#94a3b8');
      g.addColorStop(1, can ? '#0f766e' : '#475569');
      ctx.fillStyle = g;
      roundRect(r.x, r.y, r.w, r.h, 14);
      ctx.fill();
      ctx.strokeStyle = can
        ? `rgba(153,246,228,${0.55 + pulse * 0.45})`
        : 'rgba(226,232,240,0.55)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Property badge — which factory this [+] belongs to
      drawMachineSign(m.id, r.x + r.w / 2, r.y + 12, true, 0.42);

      // Big [+]
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 26px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('+', r.x + r.w / 2, r.y + r.h / 2 + 10);
      ctx.font = '800 11px Outfit, sans-serif';
      ctx.fillStyle = can ? '#ecfdf5' : '#fecdd3';
      ctx.fillText(String(cost), r.x + r.w / 2, r.y + r.h - 6);
      ctx.textAlign = 'left';

      if (hot && can && (state.buyT[m.id] || 0) > 0) {
        drawProgressRing(r.x + r.w / 2, r.y + r.h / 2, 18, state.buyT[m.id] / 0.75, '#5eead4');
      }
    }

    function machineDepthY(m) {
      // Front edge of the shed — anything with smaller y is "behind" the roof.
      return m.body.y + m.body.h;
    }

    function drawMachineFrontUI(m) {
      const lv = mLv(m.id);
      const owned = lv >= 1;
      const onIn = owned && inRect(state.player, m.input);
      const lure = !owned && !mLv('parallel') && state.carry.some((g) => g.kind === 'raw');
      const ws = state.workshops[m.id];
      const inWarn = warnOn('in:' + m.id);

      if (owned) {
        drawPad(m.input, '↓', onIn, inWarn);
        if (ws) ws.queue.forEach((g, i) => drawGemOnShelf(g, m.input, i, inWarn));
        drawUpgradePad(m);
      } else {
        const buyR = { x: m.input.x, y: m.input.y, w: m.input.w, h: m.input.h };
        const hot = inRect(state.player, kioskRect(m));
        const locked = m.req && mLv(m.req) < 1;
        const cost = m.costs[0];
        const can = !locked && state.gold >= cost;
        drawShelfBoard(buyR, hot);
        drawCostBadge(buyR.x + buyR.w / 2, buyR.y + buyR.h / 2 + 2, cost, can, locked);
        if (hot && can && (state.buyT[m.id] || 0) > 0) {
          drawProgressRing(buyR.x + buyR.w / 2, buyR.y + buyR.h / 2 + 4, 20, state.buyT[m.id] / 0.75, '#f0c36a');
        }
        if (lure && m.id === 'parallel') {
          ctx.strokeStyle = `rgba(240,195,106,${0.4 + 0.4 * Math.sin(performance.now() / 280)})`;
          ctx.lineWidth = 3;
          ctx.setLineDash([6, 4]);
          roundRect(m.body.x - 6, m.body.y - 28, m.body.w + 22, m.body.h + m.input.h + 40, 12);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }

    function drawMachineRear(m) {
      const lv = mLv(m.id);
      if (lv < 1) return;
      const onOut = inRect(state.player, m.output);
      const outWarn = warnOn('out:' + m.id);
      drawPad(m.output, '↑', onOut, outWarn);
      const ws = state.workshops[m.id];
      if (ws) ws.output.forEach((g, i) => drawGemOnShelf(g, m.output, i, outWarn));
    }

    function drawMachineProcess(m) {
      const lv = mLv(m.id);
      if (lv < 1) return;
      const ws = state.workshops[m.id];
      if (!ws) return;
      const cx = m.body.x + m.body.w / 2;
      const cy = m.body.y + m.body.h * 0.55;
      const outWarn = warnOn('out:' + m.id);
      ws.processing.forEach((p, i) => {
        const ox = (i - (ws.processing.length - 1) / 2) * 18;
        const worldPts = p.pts.map(([x, y]) => [x + cx + ox, y + cy]);
        const blocked = outWarn && p.progress >= 0.98;
        ctx.save();
        if (blocked) {
          const pulse = warnPulse();
          poly(worldPts, `rgba(251,113,133,${0.55 + pulse * 0.4})`, '#fecdd3', 2.6);
        } else {
          const style = GEMS[p.kind];
          poly(worldPts, style.fill, style.line, 2.4);
        }
        ctx.restore();
      });
    }

    function drawLanes() {
      // Rear shelves sit on the ground behind every shed.
      MACHINES.forEach((m) => drawMachineRear(m));

      // Y-sort: when the cat is behind a shed, draw the cat first so the roof covers them.
      const layers = MACHINES.map((m) => ({ kind: 'machine', m, y: machineDepthY(m) }));
      layers.push({ kind: 'market', y: MARKET_PAD.y - 8 });
      layers.push({ kind: 'bills', y: CASH_ANCHOR.y });
      layers.push({ kind: 'player', y: state.player.y });
      layers.sort((a, b) => a.y - b.y || (a.kind === 'player' ? -1 : 1));

      layers.forEach((layer) => {
        if (layer.kind === 'player') {
          drawPlayer();
          return;
        }
        if (layer.kind === 'bills') {
          drawBills();
          return;
        }
        if (layer.kind === 'market') {
          drawMarketPad();
          return;
        }
        const m = layer.m;
        drawMachineBuilding(m, mLv(m.id));
        drawMachineProcess(m);
        drawMachineFrontUI(m);
      });
    }

    function drawGemOnShelf(g, pad, i, warn) {
      const slot = shelfSlot(pad, i);
      const pos = flyPos(g, slot);
      const scale = g.fly ? 0.85 + 0.15 * easeOutCubic(g.fly.t) : 1;
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath();
      ctx.ellipse(pos.x + 1, slot.y + 4, 7 * scale, 3.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.translate(pos.x, pos.y);
      if (warn) drawWarnGem(g.kind, g.seed, GEM_STACK_S * scale);
      else paintGem(g.kind, GEM_STACK_S * scale, g.seed, { lw: 2.4 });
      ctx.restore();
    }

    function drawWorkshopGems() {
      // Gems are drawn per-machine inside drawLanes depth pass.
    }

    function drawOrderBoard() {
      const bx = 780, by = 118, bw = 150, bh = 128;

      ctx.strokeStyle = 'rgba(180,120,60,0.55)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bx + 20, by - 8); ctx.lineTo(bx + 20, by + 6);
      ctx.moveTo(bx + bw - 20, by - 8); ctx.lineTo(bx + bw - 20, by + 6);
      ctx.stroke();

      const ord = state.order;
      if (!ord) {
        ctx.fillStyle = 'rgba(36,22,12,0.72)';
        roundRect(bx, by, bw, bh, 10);
        ctx.fill();
        ctx.strokeStyle = 'rgba(180,120,60,0.45)';
        ctx.lineWidth = 2;
        roundRect(bx, by, bw, bh, 10);
        ctx.stroke();
        ctx.fillStyle = 'rgba(148,163,184,0.75)';
        ctx.font = '700 15px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('…', bx + bw / 2, by + 70);
        ctx.textAlign = 'left';
        return;
      }

      const urgent = ord.t < 6;
      const flash = state.orderFlash || 0;

      ctx.fillStyle = flash > 0
        ? `rgba(88,28,60,${0.75 + 0.2 * flash})`
        : 'rgba(36,22,12,0.82)';
      roundRect(bx, by, bw, bh, 10);
      ctx.fill();
      ctx.strokeStyle = urgent
        ? 'rgba(251,113,133,0.95)'
        : (flash > 0 ? `rgba(249,168,212,${0.5 + 0.5 * flash})` : 'rgba(180,120,60,0.65)');
      ctx.lineWidth = urgent || flash > 0.3 ? 3 : 2;
      roundRect(bx, by, bw, bh, 10);
      ctx.stroke();

      ctx.fillStyle = urgent ? '#fb7185' : '#f9a8d4';
      ctx.font = '800 15px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('특별요청', bx + bw / 2, by + 22);
      ctx.textAlign = 'left';

      gemAt(ord.kind, bx + 44, by + 62, 26, 4);
      ctx.fillStyle = urgent ? '#fb7185' : '#f9a8d4';
      ctx.font = '800 22px Outfit, sans-serif';
      ctx.fillText('×' + ord.mult, bx + 88, by + 58);
      ctx.font = '800 18px Outfit, sans-serif';
      ctx.fillText(ord.got + '/' + ord.need, bx + 88, by + 84);

      const p = Math.max(0, ord.t / ord.maxT);
      ctx.fillStyle = 'rgba(148,163,184,0.3)';
      roundRect(bx + 16, by + bh - 22, bw - 32, 6, 3);
      ctx.fill();
      ctx.fillStyle = urgent ? '#fb7185' : '#f472b6';
      roundRect(bx + 16, by + bh - 22, (bw - 32) * p, 6, 3);
      ctx.fill();
    }

    function drawPlayer() {
      const p = state.player;
      const now = performance.now() / 1000;
      const bob = p.moving ? Math.sin(p.walkT * WALK_FPS * Math.PI) * 2.2 : 0;

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + 6, 22, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Backpack stack — tall tower; flying gems arc onto the pile.
      // Full + stuck at mine/output: blink red ~1s, rest, repeat. Leave → normal colors.
      const n = state.carry.length;
      const warn = warnOn('carry');
      const fullPulse = warn ? warnPulse() : 0;
      const back = -p.facing * 16;
      for (let i = 0; i < n; i++) {
        const gem = state.carry[i];
        const sway = Math.sin(now * 4 + i * 0.45) * (p.moving ? 2.2 : 0.8);
        const stack = { x: p.x + back + sway, y: p.y - 24 - stackStep(i, n) + bob };
        const pos = flyPos(gem, stack);
        const flying = !!gem.fly;
        ctx.save();
        ctx.translate(pos.x, pos.y);
        if (flying) {
          const e = easeOutCubic(gem.fly.t);
          const s = 0.9 + 0.1 * e;
          ctx.scale(s, s);
        }
        const style = GEMS[gem.kind];
        if (warn) {
          paintGem(gem.kind, GEM_STACK_S, gem.seed, {
            fill: `rgba(251,113,133,${0.55 + fullPulse * 0.45})`,
            line: `rgba(254,202,202,${0.7 + fullPulse * 0.3})`,
            lw: 2.6
          });
        } else {
          paintGem(gem.kind, GEM_STACK_S, gem.seed, { line: style.line, lw: 2.4 });
        }
        ctx.restore();
      }

      const { img, mirror } = catImg(p);
      if (img && img.width > 0) {
        ctx.save();
        ctx.translate(p.x, p.y + bob);
        if (mirror) ctx.scale(-1, 1);

        const dw = CAT_SIZE;
        const dh = dw * (art.catAspect || 1.3);

        ctx.drawImage(img, -dw / 2, -dh + 6, dw, dh);
        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(p.x, p.y + bob);
        ctx.scale(p.facing, 1);
        // 몸통
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.ellipse(0, -22, 16, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        // 흰 배
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(2, -18, 9, 13, 0, 0, Math.PI * 2);
        ctx.fill();
        // 귀
        ctx.fillStyle = '#c2410c';
        ctx.beginPath();
        ctx.moveTo(-12, -34); ctx.lineTo(-4, -46); ctx.lineTo(2, -36);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(2, -36); ctx.lineTo(10, -46); ctx.lineTo(14, -34);
        ctx.fill();
        // 초록 눈
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(8, -26, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawFloaters() {
      state.floaters.forEach((f) => {
        ctx.save();
        ctx.globalAlpha = 1 - f.t;
        ctx.fillStyle = f.color;
        ctx.font = (f.big ? '800 26px' : '800 20px') + ' Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y - f.t * 46);
        ctx.restore();
      });
      ctx.textAlign = 'left';
    }

    function drawSparks() {
      state.sparks.forEach((sp) => {
        const a = 1 - sp.life / sp.max;
        const r = (sp.r || 2.2) + 2 * a;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      state.dust.forEach((d) => {
        const a = 1 - d.life / d.max;
        ctx.save();
        ctx.globalAlpha = a * 0.45;
        ctx.fillStyle = '#c4b5fd';
        ctx.beginPath();
        ctx.arc(d.x, d.y, 2 + 3 * (1 - a), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawTip() {
      const tip = state.tip;
      if (!tip) return;
      const fade = tip.t < 0.25 ? tip.t / 0.25 : tip.t > tip.max - 0.4 ? (tip.max - tip.t) / 0.4 : 1;
      const p = state.player;
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade);
      ctx.font = '700 15px Pretendard, sans-serif';
      const w = Math.min(320, ctx.measureText(tip.text).width + 28);
      const x = Math.max(40, Math.min(MAP_W - w - 40, p.x - w / 2));
      const y = p.y - 100;
      ctx.fillStyle = 'rgba(20,12,28,0.92)';
      roundRect(x, y, w, 32, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(240,195,106,0.7)';
      ctx.lineWidth = 2;
      roundRect(x, y, w, 32, 12);
      ctx.stroke();
      ctx.fillStyle = '#f5e9d6';
      ctx.textAlign = 'center';
      ctx.fillText(tip.text, x + w / 2, y + 21);
      ctx.textAlign = 'left';
      ctx.restore();
    }

    function drawAppraisal() {
      const a = state.appraisal;
      if (!a) return;
      const k = Math.max(0.72, Math.min(1, view.w / 900));
      const W = 248, H = 176;
      ctx.save();
      ctx.translate(view.w - W * k - 14, view.h - H * k - 14);
      ctx.scale(k, k);
      ctx.globalAlpha = Math.min(1, (2.8 - a.life) * 2);

      ctx.fillStyle = 'rgba(22,12,30,0.94)';
      roundRect(0, 0, W, H, 14);
      ctx.fill();
      ctx.strokeStyle = a.wanted ? 'rgba(244,114,182,0.7)' : 'rgba(240,195,106,0.45)';
      ctx.lineWidth = 2;
      roundRect(0, 0, W, H, 14);
      ctx.stroke();
      ctx.fillStyle = a.wanted ? '#f9a8d4' : '#c4b5fd';
      [[8, 8], [W - 8, 8], [8, H - 8], [W - 8, H - 8]].forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      });

      const info = GEMS[a.kind];
      const pts = shapeFor(a.kind, 36, a.seed);
      ctx.save();
      ctx.translate(58, 62);
      paintGem(a.kind, 36, a.seed, { blur: 14, lw: 2 });
      drawDiagonals(pts, info.props, Math.min(1, a.t / 0.32));
      ctx.restore();

      ctx.fillStyle = '#f8fafc';
      ctx.font = '800 15px Pretendard, sans-serif';
      ctx.fillText(info.name, 112, 28);

      ctx.fillStyle = '#fde68a';
      ctx.font = '800 28px Outfit, sans-serif';
      ctx.fillText(String(a.value), 112, 62);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '700 12px Outfit, sans-serif';
      ctx.fillText('💰', 112, 80);
      if (a.wanted) {
        ctx.fillStyle = '#f9a8d4';
        ctx.font = '800 15px Outfit, sans-serif';
        ctx.fillText('주문 ×' + (a.mult || 1), 150, 80);
      }

      // Diagonal verdict — the educational sell feedback
      const prog = Math.min(1, Math.max(0, (a.t - 0.28) / 0.35));
      if (prog > 0) {
        ctx.globalAlpha = Math.min(1, (2.8 - a.life) * 2) * prog;
        ctx.fillStyle = 'rgba(36,22,48,0.9)';
        roundRect(12, H - 58, W - 24, 44, 10);
        ctx.fill();
        ctx.strokeStyle = info.line;
        ctx.lineWidth = 1.5;
        roundRect(12, H - 58, W - 24, 44, 10);
        ctx.stroke();

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '700 11px Pretendard, sans-serif';
        ctx.fillText('성질', 22, H - 38);
        ctx.fillStyle = '#fde68a';
        ctx.font = '800 13px Pretendard, sans-serif';
        const verdict = info.diag;
        // Wrap long Korean lines
        if (verdict.length > 16) {
          const mid = Math.ceil(verdict.length / 2);
          let split = verdict.lastIndexOf(' ', mid);
          if (split < 6) split = verdict.indexOf('·', 6);
          if (split < 6) split = mid;
          ctx.fillText(verdict.slice(0, split).trim(), 22, H - 20);
          ctx.fillText(verdict.slice(split).replace(/^[·\s]+/, '').trim(), 22, H - 6);
        } else {
          ctx.fillText(verdict, 22, H - 18);
        }
      }
      ctx.restore();
    }

    function drawStick() {
      if (!stick) return;
      ctx.save();
      ctx.fillStyle = 'rgba(30,16,40,0.55)';
      ctx.beginPath();
      ctx.arc(stick.bx, stick.by, STICK_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(196,181,253,0.7)';
      ctx.lineWidth = 3;
      ctx.stroke();
      const dx = stick.x - stick.bx, dy = stick.y - stick.by;
      const len = Math.hypot(dx, dy) || 1;
      const k = Math.min(len, STICK_R) / len;
      ctx.fillStyle = '#f0c36a';
      ctx.beginPath();
      ctx.arc(stick.bx + dx * k, stick.by + dy * k, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawAtmosphere() {
      const t = performance.now() / 1000;
      const haze = ctx.createLinearGradient(0, 40, 0, 220);
      haze.addColorStop(0, 'rgba(88,50,140,0.22)');
      haze.addColorStop(1, 'rgba(88,50,140,0)');
      ctx.fillStyle = haze;
      ctx.fillRect(20, 44, MAP_W - 40, 160);
      for (let i = 0; i < 12; i++) {
        const px = 80 + (i * 79 + Math.sin(t * 0.4 + i) * 18) % 840;
        const py = 90 + (i * 37) % 430;
        ctx.fillStyle = `rgba(196,181,253,${0.12 + 0.12 * Math.sin(t * 2 + i)})`;
        ctx.beginPath();
        ctx.arc(px, py, 1.6 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawRipples() {
      if (!state || !state.ripples) return;
      state.ripples.forEach((r) => {
        const a = Math.max(0, 1 - r.t);
        const radius = 6 + r.t * 22;
        ctx.save();
        ctx.beginPath();
        ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(240, 195, 106, ${a * 0.85})`;
        ctx.lineWidth = 2.4 * a;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(r.x, r.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(240, 195, 106, ${a * 0.9})`;
        ctx.fill();
        ctx.restore();
      });
    }

    function draw() {
      if (!state) return;
      const bg = ctx.createLinearGradient(0, 0, 0, view.h);
      bg.addColorStop(0, '#1c1230');
      bg.addColorStop(0.45, '#140c20');
      bg.addColorStop(1, '#0c0814');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, view.w, view.h);

      ctx.save();
      const sh = state.shake || 0;
      const jx = sh ? (Math.random() - 0.5) * 10 * sh : 0;
      const jy = sh ? (Math.random() - 0.5) * 8 * sh : 0;
      ctx.translate(view.ox + jx, view.oy + jy);
      ctx.scale(view.scale, view.scale);

      drawAtmosphere();
      drawYard();
      drawRipples();

      uiHits = [];
      drawMineVein();
      drawBagPad();
      drawLanes();
      drawOrderBoard();
      drawSparks();
      drawFloaters();
      if (state.phase === 'cutLesson') drawCutLesson();

      ctx.restore();

      drawAppraisal();
      if (state.phase === 'play') drawStick();
    }

    // ---------- HUD & shop ----------
    const el = {
      time: document.getElementById('hud-time'),
      timeFill: document.getElementById('hud-time-fill'),
      gold: document.getElementById('hud-gold'),
      chipGold: document.getElementById('chip-gold'),
      chipTime: document.getElementById('chip-time'),
      shop: document.getElementById('shop'),
      shopList: document.getElementById('shop-list')
    };

    function fmtTime(t) {
      const m = Math.floor(t / 60), s = Math.floor(t % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function updateHud() {
      el.time.textContent = fmtTime(state.time);
      const ratio = Math.max(0, Math.min(1, state.time / GAME_TIME));
      if (el.timeFill) el.timeFill.style.transform = 'scaleX(' + ratio + ')';
      el.gold.textContent = state.gold;
      el.chipTime.classList.toggle('warn', state.time <= 30);
      if (el.chipGold) {
        el.chipGold.classList.toggle('pulse', state.earnFlash > 0);
        el.chipGold.classList.toggle('poor', state.poorFlash > 0 && state.earnFlash <= 0);
      }
    }

    const buttons = {};
    MACHINES.forEach((m) => {
      const btn = document.createElement('button');
      btn.className = 'buy';
      btn.innerHTML = `<span class="pic">${svgFor(m.sign[1], 26)}</span>
        <span class="txt">${m.name}</span>
        <span class="cost">${m.costs[0]}💰</span>`;
      btn.addEventListener('click', () => buy(m));
      el.shopList.appendChild(btn);
      buttons[m.id] = btn;
    });

    let shopSig = '';
    function updateShop(visible) {
      if (!visible) return;
      const sig = state.gold + '|' + MACHINES.map((m) => mLv(m.id)).join('');
      if (sig === shopSig) return;
      shopSig = sig;
      MACHINES.forEach((m) => {
        const btn = buttons[m.id];
        const lv = mLv(m.id);
        const locked = m.req && mLv(m.req) < 1;
        const max = mMax(m);
        const cost = lv >= max ? 0 : m.costs[lv];
        btn.classList.toggle('owned', lv >= max);
        btn.classList.toggle('locked', lv < 1 && locked);
        btn.classList.toggle('poor', lv < max && !(lv < 1 && locked) && state.gold < cost);
        const costEl = btn.querySelector('.cost');
        if (lv >= max) costEl.textContent = '★' + max;
        else if (lv >= 1) costEl.textContent = '강화 ' + cost + '💰';
        else costEl.textContent = locked ? '🔒' : cost + '💰';
      });
    }

    function updateShopAtMachine() {
      const m = machineAtKiosk(state.player);
      if (!m) {
        el.shop.classList.add('hidden');
        MACHINES.forEach((mm) => { buttons[mm.id].style.display = ''; });
        return;
      }
      el.shop.classList.remove('hidden');
      MACHINES.forEach((mm) => {
        buttons[mm.id].style.display = mm.id === m.id ? '' : 'none';
      });
      updateShop(true);
    }

    function buy(m) {
      const lv = mLv(m.id);
      if (lv >= mMax(m)) return;
      if (m.req && mLv(m.req) < 1) return;
      const cost = m.costs[lv];
      if (state.gold < cost) {
        state.poorFlash = Math.max(state.poorFlash, 0.7);
        return;
      }
      state.gold -= cost;
      state.owned[m.id] = lv + 1;
      shopSig = '';
      addFloater(state.player.x, state.player.y - 46, '-' + cost, '#fb7185');
      addSparks(state.player.x, state.player.y - 30, '#c4b5fd', 12);
      state.glow[m.id] = 1;
      state.shake = Math.max(state.shake, 0.12);
    }

    // ---------- cut lesson: irregular quad + two parallel cuts → trapezoid ----------
    const LESSON_GEM = 56;

    function startCutLesson(seed) {
      stick = null;
      if (el && el.shop) el.shop.classList.add('hidden');
      state.phase = 'cutLesson';
      state.cutLesson = {
        stage: 'cut1',
        seed: seed == null ? state.seed++ : seed,
        cuts: 0,
        progress: 0,
        grind: 0,
        drag: null,
        pulse: 0,
        failFlash: 0,
        sparkCd: 0,
        revealT: 0,
        cx: MAP_W / 2,
        cy: MAP_H / 2 - 4
      };
    }

    function lessonHit(p, q, y) {
      const t = (y - p[1]) / (q[1] - p[1]);
      return [p[0] + t * (q[0] - p[0]), y];
    }

    function lessonGeom(s) {
      // Ordinary quad: 4 sides, no parallels, no right angles.
      const A = [-0.88 * s, -0.40 * s];
      const B = [0.58 * s, -0.82 * s];
      const C = [1.20 * s, 0.86 * s];
      const D = [-1.10 * s, 0.64 * s];
      const cut1Y = 0.40 * s;
      const cut2Y = -0.26 * s;
      const L1 = lessonHit(D, A, cut1Y);
      const R1 = lessonHit(B, C, cut1Y);
      const L2 = lessonHit(A, L1, cut2Y);
      const R2 = lessonHit(B, R1, cut2Y);
      return {
        cut1Y, cut2Y, L1, R1, L2, R2,
        raw: [A, B, C, D],
        remain1: [A, B, R1, L1],
        scrap1: [L1, R1, C, D],
        remain2: [L2, R2, R1, L1],
        scrap2: [A, B, R2, L2]
      };
    }

    function cutGuide(lesson) {
      const g = lessonGeom(LESSON_GEM);
      const { cx, cy } = lesson;
      if (lesson.cuts === 0) {
        return {
          x0: cx + g.L1[0] - 22, y0: cy + g.cut1Y,
          x1: cx + g.R1[0] + 22, y1: cy + g.cut1Y
        };
      }
      return {
        x0: cx + g.L2[0] - 22, y0: cy + g.cut2Y,
        x1: cx + g.R2[0] + 22, y1: cy + g.cut2Y
      };
    }

    function distToSeg(px, py, x0, y0, x1, y1) {
      const dx = x1 - x0, dy = y1 - y0;
      const l2 = dx * dx + dy * dy || 1;
      const t = Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / l2));
      return Math.hypot(px - (x0 + t * dx), py - (y0 + t * dy));
    }

    function guideAlong(px, py, lesson) {
      const g = cutGuide(lesson);
      const dx = g.x1 - g.x0, dy = g.y1 - g.y0;
      const l2 = dx * dx + dy * dy || 1;
      return ((px - g.x0) * dx + (py - g.y0) * dy) / l2;
    }

    function nearCutGuide(px, py, lesson) {
      const g = cutGuide(lesson);
      return distToSeg(px, py, g.x0, g.y0, g.x1, g.y1) < 38;
    }

    function cutIsGrinding(d, lesson) {
      if (!d) return false;
      return nearCutGuide(d.x1, d.y1, lesson);
    }

    function completeOneCut(lesson) {
      const g = cutGuide(lesson);
      lesson.progress = 0;
      lesson.drag = null;
      lesson.grind = 0;
      lesson.cuts += 1;
      lesson.revealT = 0.55;
      addSparks((g.x0 + g.x1) / 2, (g.y0 + g.y1) / 2, '#fde68a', 12);
      state.shake = Math.max(state.shake, 0.2);
      if (lesson.cuts >= 2) {
        lesson.stage = 'done';
        lesson.revealT = 0.7;
      } else {
        lesson.stage = 'cut2';
      }
    }

    function onCutPointerDown(e) {
      const lesson = state.cutLesson;
      if (!lesson || (lesson.stage !== 'cut1' && lesson.stage !== 'cut2')) return;
      if (lesson.revealT > 0) return;
      const p = mapPointer(e);
      lesson.drag = {
        id: e.pointerId,
        x0: p.x, y0: p.y,
        x1: p.x, y1: p.y,
        lastX: p.x, lastY: p.y,
        startT: guideAlong(p.x, p.y, lesson)
      };
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    }

    function onCutPointerMove(e) {
      const lesson = state.cutLesson;
      if (!lesson || !lesson.drag || lesson.drag.id !== e.pointerId) return;
      if (lesson.stage !== 'cut1' && lesson.stage !== 'cut2') return;
      const p = mapPointer(e);
      const d = lesson.drag;
      d.x1 = p.x;
      d.y1 = p.y;

      if (nearCutGuide(p.x, p.y, lesson)) {
        const t = Math.max(0, Math.min(1, guideAlong(p.x, p.y, lesson)));
        lesson.progress = Math.max(lesson.progress, t);
        lesson.grind = 1;
        state.shake = Math.max(state.shake, 0.08 + lesson.progress * 0.14);
        if (lesson.sparkCd <= 0) {
          lesson.sparkCd = 0.025;
          const g = cutGuide(lesson);
          const gdx = g.x1 - g.x0, gdy = g.y1 - g.y0;
          const glen = Math.hypot(gdx, gdy) || 1;
          const nx = gdy / glen, ny = -gdx / glen;
          state.sparks.push({
            x: d.x1 + (Math.random() - 0.5) * 6,
            y: d.y1 + (Math.random() - 0.5) * 6,
            vx: nx * (40 + Math.random() * 50) + (Math.random() - 0.5) * 40,
            vy: ny * (40 + Math.random() * 50) + (Math.random() - 0.5) * 40,
            color: Math.random() > 0.45 ? '#fde68a' : '#fda4af',
            life: 0,
            max: 0.3 + Math.random() * 0.25,
            r: 1.6 + Math.random() * 2.4
          });
        }
        if (t >= 0.88 && (d.startT < 0.55 || lesson.progress >= 0.88)) {
          completeOneCut(lesson);
          return;
        }
      }
      d.lastX = p.x;
      d.lastY = p.y;
    }

    function onCutPointerUp(e) {
      const lesson = state.cutLesson;
      if (!lesson || !lesson.drag || lesson.drag.id !== e.pointerId) return;
      const d = lesson.drag;
      const t = guideAlong(d.x1, d.y1, lesson);
      lesson.drag = null;
      lesson.grind = 0;
      if (lesson.stage !== 'cut1' && lesson.stage !== 'cut2') return;

      if (nearCutGuide(d.x1, d.y1, lesson) && t >= 0.88) {
        completeOneCut(lesson);
      } else if (lesson.progress < 0.85) {
        const len = Math.hypot(d.x1 - d.x0, d.y1 - d.y0);
        if (len > 35) lesson.failFlash = 0.75;
      }
    }

    function updateCutLesson(dt) {
      const lesson = state.cutLesson;
      if (!lesson) return;
      lesson.pulse += dt;
      lesson.sparkCd = Math.max(0, lesson.sparkCd - dt);
      if (lesson.failFlash > 0) lesson.failFlash = Math.max(0, lesson.failFlash - dt);
      if (!lesson.drag) lesson.grind = Math.max(0, lesson.grind - dt * 4);

      if (lesson.revealT > 0) {
        lesson.revealT -= dt;
        if (lesson.stage === 'done' && lesson.revealT <= 0) {
          finishCutLesson();
          return;
        }
      }

      state.sparks = state.sparks.filter((sp) => {
        sp.life += dt;
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        sp.vy += 240 * dt;
        return sp.life < sp.max;
      });
      state.floaters = state.floaters.filter((f) => (f.t += dt) < 1);
      state.shake = Math.max(0, state.shake - dt * 1.4);
    }

    function finishCutLesson() {
      const lesson = state.cutLesson;
      if (!lesson) return;
      state.lessons.parallel = true;
      ensureWorkshops(state);
      const m = MACHINES.find((mm) => mm.id === 'parallel');
      const ws = state.workshops.parallel;
      const gem = {
        kind: 'trap',
        seed: lesson.seed,
        pts: shapeFor('trap', GEM_S, lesson.seed),
        from: null,
        to: null,
        t: 1
      };
      const slot = shelfSlot(m.output, ws.output.length);
      startFly(gem, m.body.x + m.body.w / 2, m.body.y + m.body.h / 2, slot.x, slot.y);
      ws.output.push(gem);
      state.glow.parallel = 1;
      addFloater(slot.x, slot.y - 22, '사다리꼴 완성!', '#6ee7b7', true);
      addSparks(slot.x, slot.y, GEMS.trap.line, 16);
      state.cutLesson = null;
      state.phase = 'play';
    }

    function drawCutLesson() {
      const lesson = state.cutLesson;
      if (!lesson) return;
      const { cx, cy } = lesson;
      const geo = lessonGeom(LESSON_GEM);
      const guide = cutGuide(lesson);
      const cutting = lesson.stage === 'cut1' || lesson.stage === 'cut2';
      const fill = '#3f322e';
      const border = lesson.cuts >= 2 ? GEMS.trap.line : GEMS.raw.line;

      ctx.fillStyle = 'rgba(8, 6, 16, 0.72)';
      ctx.fillRect(0, 0, MAP_W, MAP_H);

      const cardW = 440, cardH = 400;
      const cardX = cx - cardW / 2, cardY = cy - cardH / 2 - 16;
      ctx.fillStyle = 'rgba(28, 18, 40, 0.96)';
      roundRect(cardX, cardY, cardW, cardH, 18);
      ctx.fill();
      ctx.strokeStyle = 'rgba(52, 211, 153, 0.7)';
      ctx.lineWidth = 3;
      roundRect(cardX, cardY, cardW, cardH, 18);
      ctx.stroke();

      const stepLabel = lesson.cuts === 0 ? '1 / 2  첫 번째 절단' : (lesson.cuts === 1 ? '2 / 2  평행하게 한 번 더' : '완성!');
      ctx.fillStyle = '#6ee7b7';
      ctx.font = '800 22px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('나란히 자르기', cx, cardY + 34);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '700 13px Pretendard, sans-serif';
      ctx.fillText(stepLabel, cx, cardY + 56);
      ctx.fillStyle = lesson.failFlash > 0 ? '#fb7185' : '#cbd5e1';
      ctx.font = '700 15px Pretendard, sans-serif';
      const hint = lesson.failFlash > 0
        ? (lesson.cuts === 0 ? '왼쪽에서 오른쪽 끝까지!' : '평행선을 오른쪽 끝까지!')
        : (lesson.cuts === 0
          ? '아래를 가로로 잘라 평평한 면을 만드세요'
          : '위쪽을 첫 절단면과 평행하게 자르세요');
      ctx.fillText(hint, cx, cardY + 78);
      ctx.textAlign = 'left';

      for (let i = 0; i < 2; i++) {
        ctx.fillStyle = lesson.cuts > i ? '#34d399' : 'rgba(148,163,184,0.35)';
        ctx.beginPath();
        ctx.arc(cx - 18 + i * 36, cardY + 98, 7, 0, Math.PI * 2);
        ctx.fill();
      }
      if (cutting) {
        const barW = 200, barH = 10;
        const barX = cx - barW / 2, barY = cardY + 112;
        ctx.fillStyle = 'rgba(15,23,42,0.9)';
        roundRect(barX, barY, barW, barH, 5);
        ctx.fill();
        ctx.fillStyle = '#fbbf24';
        roundRect(barX, barY, barW * Math.min(1, lesson.progress || 0), barH, 5);
        ctx.fill();
      }

      if (cutting) {
        const pulse = 0.4 + 0.6 * Math.sin(lesson.pulse * 5);
        ctx.save();
        ctx.globalAlpha = 0.4 + pulse * 0.4;
        ctx.strokeStyle = '#5eead4';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 7]);
        ctx.beginPath();
        ctx.moveTo(guide.x0, guide.y0);
        ctx.lineTo(guide.x1, guide.y1);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        drawMarkedSeg(guide.x0, guide.y0, guide.x1, guide.y1, 1, 'rgba(94,234,212,0.9)');
      }

      const grinding = lesson.drag && cutIsGrinding(lesson.drag, lesson);
      const vib = grinding ? (Math.random() - 0.5) * (2 + lesson.progress * 3) : 0;
      const vibY = grinding ? (Math.random() - 0.5) * 2 : 0;
      const t = Math.min(1, lesson.progress || 0);

      let remain = geo.raw;
      let scrap = null;
      let fallX = 0, fallY = 0;
      let faceA = geo.L1, faceB = geo.R1;
      if (lesson.cuts === 0) {
        remain = t > 0.02 ? geo.remain1 : geo.raw;
        if (t > 0.02) {
          scrap = geo.scrap1;
          fallY = t * 32;
        }
        faceA = geo.L1;
        faceB = geo.R1;
      } else if (lesson.cuts === 1) {
        remain = t > 0.02 ? geo.remain2 : geo.remain1;
        if (t > 0.02) {
          scrap = geo.scrap2;
          fallY = -t * 32;
        }
        faceA = geo.L2;
        faceB = geo.R2;
      } else {
        remain = geo.remain2;
        faceA = geo.L2;
        faceB = geo.R2;
      }

      ctx.save();
      ctx.translate(cx + vib, cy + vibY);
      if (scrap) {
        ctx.save();
        ctx.globalAlpha = 0.45 + t * 0.4;
        ctx.translate(fallX, fallY);
        poly(scrap, fill, border, 2.4);
        ctx.restore();
      }
      poly(remain, fill, border, 3);
      const inner = remain.map((p) => [p[0] * 0.72, p[1] * 0.72]);
      const ih = hash(lesson.seed || 1);
      poly(inner, ih < 0.34 ? '#c4b5fd' : ih < 0.67 ? '#5eead4' : '#fbbf24', 'rgba(255,255,255,0.35)', 1);
      if (cutting || lesson.cuts >= 1) {
        ctx.strokeStyle = `rgba(253,224,71,${0.55 + t * 0.45})`;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(faceA[0], faceA[1]);
        ctx.lineTo(faceB[0], faceB[1]);
        ctx.stroke();
      }
      if (lesson.cuts >= 1) {
        drawMarkedSeg(geo.L1[0], geo.cut1Y, geo.R1[0], geo.cut1Y, 1, 'rgba(52,211,153,0.95)');
      }
      if (lesson.cuts >= 2) {
        drawMarkedSeg(geo.L2[0], geo.cut2Y, geo.R2[0], geo.cut2Y, 1, 'rgba(52,211,153,0.95)');
      }
      ctx.restore();

      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      roundRect(cx - 196, cy + 62, 392, 52, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(253, 224, 71, 0.55)';
      ctx.lineWidth = 1.6;
      roundRect(cx - 196, cy + 62, 392, 52, 12);
      ctx.stroke();
      ctx.fillStyle = '#fde68a';
      ctx.font = '800 16px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('이 기계는 한 쌍의 대변을', cx, cy + 84);
      ctx.fillText('평행하게 만들어 줍니다', cx, cy + 104);
      ctx.textAlign = 'left';

      const guideAng = Math.atan2(guide.y1 - guide.y0, guide.x1 - guide.x0);
      if (lesson.drag && cutting) {
        const d = lesson.drag;
        const gnd = cutIsGrinding(d, lesson);
        const bx = d.x1 + (gnd ? (Math.random() - 0.5) * 2.5 : 0);
        const by = d.y1 + (gnd ? (Math.random() - 0.5) * 2.5 : 0);
        ctx.strokeStyle = gnd ? '#fbbf24' : 'rgba(253,230,138,0.5)';
        ctx.lineWidth = gnd ? 4 : 2;
        ctx.setLineDash(gnd ? [] : [4, 4]);
        ctx.beginPath();
        ctx.moveTo(guide.x0, guide.y0);
        ctx.lineTo(guide.x1, guide.y1);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(guideAng);
        if (gnd) ctx.translate((Math.random() - 0.5) * 2, 0);
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(-10, -12);
        ctx.lineTo(-10, 12);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = gnd ? '#f59e0b' : '#34d399';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      } else if (cutting) {
        const hx = guide.x0 + 8;
        const hy = guide.y0 + Math.sin(lesson.pulse * 3) * 4;
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(guideAng);
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.moveTo(-6, -14);
        ctx.lineTo(12, 0);
        ctx.lineTo(-6, 14);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = 'rgba(226,232,240,0.9)';
        ctx.font = '700 13px Pretendard, sans-serif';
        ctx.fillText('절단 →', hx + 18, hy + 4);
      }

      if (lesson.cuts >= 2) {
        ctx.fillStyle = '#6ee7b7';
        ctx.font = '800 20px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('사다리꼴 — 한 쌍이 평행!', cx, cardY + cardH - 28);
        ctx.textAlign = 'left';
      }
    }

    // ---------- flow ----------
    const startOverlay = document.getElementById('start-overlay');
    const resultOverlay = document.getElementById('result-overlay');

    function start() {
      state = newState();
      state.phase = 'play';
      shopSig = '';
      startOverlay.classList.add('hidden');
      resultOverlay.classList.add('hidden');
      updateHud();
    }

    function finish() {
      state.phase = 'over';
      stick = null;
      keys.clear();
      el.shop.classList.add('hidden');

      const best = Number(localStorage.getItem(BEST_KEY) || 0);
      const isRecord = state.gold > best;
      if (isRecord) localStorage.setItem(BEST_KEY, String(state.gold));

      document.getElementById('final-gold').textContent = state.gold + '💰';
      document.getElementById('record-badge').classList.toggle('hidden', !isRecord);
      document.getElementById('best-line').textContent = '최고 기록 ' + Math.max(best, state.gold) + '💰';

      const tally = document.getElementById('tally');
      tally.innerHTML = '';
      Object.keys(GEMS).forEach((kind) => {
        const n = state.sold[kind] || 0;
        if (!n) return;
        const row = document.createElement('div');
        row.innerHTML = `${svgFor(kind, 20)}<span>${GEMS[kind].name} × ${n}</span>`;
        tally.appendChild(row);
      });

      document.getElementById('closing-note').textContent = '어떤 문에 무엇을 넣었는지 떠올려 보세요.';

      resultOverlay.classList.remove('hidden');
      updateHud();
    }

    document.getElementById('btn-start').addEventListener('click', start);
    document.getElementById('btn-restart').addEventListener('click', start);

    function loop(ts) {
      try {
        const dt = Math.min(0.05, (ts - last) / 1000 || 0);
        last = ts;
        if (state && state.phase === 'play') update(dt);
        else if (state && state.phase === 'cutLesson') updateCutLesson(dt);
        if (state) tickOreSpill(state, dt);
        draw();
      } catch (err) {
        console.error('PRISM TYCOON draw error:', err);
      }
      requestAnimationFrame(loop);
    }

    state = newState();
    resize();
    updateHud();
    const best = Number(localStorage.getItem(BEST_KEY) || 0);
    if (best > 0) {
      document.querySelector('#start-overlay .note')
        .insertAdjacentHTML('beforeend', `<br>🏆 현재 최고 기록: <b>${best}💰</b>`);
    }
    requestAnimationFrame(loop);
    loadArt().catch((err) => console.warn('PRISM TYCOON art load:', err));
  })();
  </script>
</body>
</html>
