<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PRISM TYCOON | 할로매쓰</title>
  <meta name="description" content="어느 레인을 밟고 지나가느냐가 보석을 결정한다. 5분 안에 금화를 최대한 모으는 수학 타이쿤.">
  <meta property="og:title" content="PRISM TYCOON | 할로매쓰">
  <meta property="og:description" content="지나간 길이 도형을 만든다">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Outfit:wght@400;600;800&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #160e22;
      --panel: rgba(28, 16, 36, 0.92);
      --gold: #f0c36a;
      --teal: #c4b5fd;
      --line: rgba(240, 195, 106, 0.32);
      --text: #f5e9d6;
      --muted: #b8a48e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: Pretendard, 'Apple SD Gothic Neo', sans-serif;
      overscroll-behavior: none;
    }
    #app { position: fixed; inset: 0; }
    #game { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

    .hud {
      position: absolute; top: 0; left: 0; right: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
      background: linear-gradient(180deg, rgba(18, 8, 26, 0.94), rgba(18, 8, 26, 0));
      pointer-events: none;
      z-index: 5;
    }
    .hud-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .hud-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
    .hud-title { font: 800 16px Outfit, sans-serif; color: var(--gold); letter-spacing: 0.06em; }
    .chip {
      display: flex; align-items: center; gap: 7px;
      background: rgba(15, 23, 42, 0.82); border: 1px solid var(--line);
      border-radius: 12px; padding: 6px 12px;
    }
    .chip .label { font: 700 11px Pretendard, sans-serif; color: var(--muted); }
    .chip .value { font: 800 20px Outfit, sans-serif; color: #f8fafc; }

    .chip.gold {
      justify-self: center;
      border-color: rgba(240, 195, 106, 0.85);
      background: linear-gradient(160deg, rgba(120, 80, 24, 0.98), rgba(40, 24, 8, 0.95));
      padding: 8px 22px 8px 16px;
      box-shadow: 0 0 0 1px rgba(240, 195, 106, 0.35), 0 8px 24px rgba(0, 0, 0, 0.45);
      transform: scale(1.05);
    }
    .chip.gold .label { color: #f0c36a; font-size: 12px; }
    .chip.gold .value { color: #ffe08a; font-size: 30px; letter-spacing: 0.02em; }
    .chip.gold.pulse {
      border-color: rgba(74, 222, 128, 0.95);
      background: linear-gradient(160deg, rgba(20, 90, 50, 0.98), rgba(40, 60, 20, 0.95));
      box-shadow:
        0 0 0 3px rgba(134, 239, 172, 0.85),
        0 0 22px rgba(74, 222, 128, 0.65),
        0 0 40px rgba(34, 197, 94, 0.35);
      transform: scale(1.12);
      animation: goldEarn 0.45s ease-out;
    }
    .chip.gold.pulse .label { color: #86efac; }
    .chip.gold.pulse .value {
      color: #bbf7d0;
      text-shadow:
        0 0 8px rgba(134, 239, 172, 1),
        0 0 18px rgba(74, 222, 128, 0.9),
        0 0 28px rgba(34, 197, 94, 0.6);
      animation: goldSparkle 0.35s ease-in-out infinite alternate;
    }
    @keyframes goldEarn {
      0% { transform: scale(1.02); filter: brightness(1); }
      35% { transform: scale(1.16); filter: brightness(1.35); }
      100% { transform: scale(1.12); filter: brightness(1.1); }
    }
    @keyframes goldSparkle {
      0% { opacity: 0.85; filter: brightness(1); }
      100% { opacity: 1; filter: brightness(1.45); }
    }
    .chip.gold.poor {
      animation: goldPoor 0.35s ease-in-out infinite;
      border-color: rgba(251, 113, 133, 0.95);
      background: linear-gradient(160deg, rgba(120, 30, 40, 0.98), rgba(50, 12, 18, 0.96));
    }
    .chip.gold.poor .label { color: #fecdd3; }
    .chip.gold.poor .value { color: #fb7185; }
    @keyframes goldPoor {
      0%, 100% { transform: scale(1.05) translateX(0); box-shadow: 0 0 0 2px rgba(251,113,133,0.45); }
      25% { transform: scale(1.08) translateX(-5px); box-shadow: 0 0 0 4px rgba(251,113,133,0.7); }
      75% { transform: scale(1.08) translateX(5px); box-shadow: 0 0 0 4px rgba(251,113,133,0.7); }
    }

    .chip.time {
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      min-width: 132px;
      padding: 6px 10px 8px;
    }
    .chip.time .time-top {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    }
    .chip.time .label { color: var(--muted); }
    .chip.time .value { font-size: 15px; color: #e2e8f0; }
    .time-gauge {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      overflow: hidden;
    }
    .time-gauge > b {
      display: block; height: 100%; width: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, #34d399, #f0c36a 55%, #fb7185);
      border-radius: 999px;
      transition: transform 0.15s linear;
    }
    .chip.time.warn .value { color: #fb7185; }
    .chip.time.warn .time-gauge { border-color: rgba(251, 113, 133, 0.7); }
    .chip.time.warn .time-gauge > b {
      background: linear-gradient(90deg, #fb7185, #ef4444);
      animation: timePulse 0.6s ease-in-out infinite;
    }
    @keyframes timePulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }

    .chip.order { border-color: rgba(244, 114, 182, 0.5); }
    .chip.order .value { font-size: 15px; color: #f9a8d4; }
    .chip.order.urgent { border-color: rgba(251, 113, 133, 0.85); box-shadow: 0 0 0 1px rgba(251,113,133,0.35); }
    .chip.order.urgent .value { color: #fb7185; }
    .chip.order svg { display: block; }
    .order-bar {
      display: block; width: 40px; height: 4px; border-radius: 2px;
      background: rgba(148, 163, 184, 0.3); overflow: hidden;
    }
    .order-bar b { display: block; height: 100%; background: #f472b6; }

    .shop {
      position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
      width: min(280px, 88vw);
      pointer-events: auto;
      background: linear-gradient(160deg, rgba(42, 24, 58, 0.94), rgba(22, 12, 32, 0.96));
      border: 1px solid var(--line); border-radius: 14px;
      padding: 8px; backdrop-filter: blur(6px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(240, 195, 106, 0.12);
      max-height: min(48vh, 300px); overflow-y: auto;
    }
    @media (max-height: 480px) {
      .shop { width: min(240px, 70vw); padding: 6px; max-height: 38vh; }
      .buy { padding: 7px 8px; margin-bottom: 5px; }
      .buy .txt { font-size: 12px; }
    }
    .buy {
      display: flex; align-items: center; gap: 10px; width: 100%;
      margin-bottom: 7px; padding: 9px 10px; cursor: pointer;
      background: rgba(76, 29, 149, 0.28); border: 1px solid rgba(196, 181, 253, 0.45);
      border-radius: 12px; color: var(--text); text-align: left; font-family: inherit;
    }
    .buy:last-child { margin-bottom: 0; }
    .buy .pic { display: flex; align-items: center; gap: 3px; }
    .buy .pic i { font-style: normal; font-size: 11px; color: var(--muted); }
    .buy .txt { flex: 1; font: 800 14px Pretendard, sans-serif; }
    .buy .cost { font: 800 14px Outfit, sans-serif; color: var(--gold); white-space: nowrap; }
    .buy.poor { background: rgba(30, 41, 59, 0.6); border-color: rgba(148, 163, 184, 0.3); cursor: not-allowed; }
    .buy.poor .cost { color: #fb7185; }
    .buy.locked { background: rgba(30, 41, 59, 0.6); border-color: rgba(148, 163, 184, 0.25); cursor: not-allowed; opacity: 0.7; }
    .buy.owned { background: rgba(76, 29, 149, 0.55); border-color: var(--teal); cursor: default; }
    .buy.owned .cost { color: var(--teal); }

    .overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: rgba(4, 7, 14, 0.88); backdrop-filter: blur(4px); overflow-y: auto;
    }
    .card {
      width: min(520px, 100%); background: #1a1026; border: 1px solid var(--line);
      border-radius: 20px; padding: 22px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .card h1 { margin: 0; font: 800 30px Outfit, sans-serif; color: var(--gold); letter-spacing: 0.08em; }
    .card .tagline { margin: 6px 0 16px; font: 700 14px Pretendard, sans-serif; color: #f0c36a; }
    .card h2 { margin: 0 0 6px; font: 800 24px Pretendard, sans-serif; color: var(--gold); text-align: center; }
    .flow { display: grid; gap: 7px; margin-bottom: 14px; }
    .flow div {
      display: flex; gap: 8px; align-items: baseline;
      font: 600 13px Pretendard, sans-serif; color: var(--muted); line-height: 1.5;
    }
    .flow b { color: #f8fafc; }
    .note {
      font: 600 12px Pretendard, sans-serif; color: var(--muted);
      border-top: 1px solid rgba(148, 163, 184, 0.2); padding-top: 10px; line-height: 1.6;
    }
    .btn-main {
      display: block; width: 100%; margin-top: 14px; padding: 14px;
      font: 800 17px Pretendard, sans-serif; cursor: pointer;
      background: linear-gradient(135deg, #f0c36a, #e8a54b); border: none; border-radius: 14px;
      color: #2a1608;
    }
    .final {
      text-align: center; margin: 10px 0 14px; padding: 14px;
      background: rgba(232, 195, 106, 0.1); border: 1px solid var(--line); border-radius: 14px;
    }
    .final .big { font: 800 46px Outfit, sans-serif; color: var(--gold); line-height: 1.1; }
    .final .sub { font: 700 13px Pretendard, sans-serif; color: var(--muted); }
    .record { margin-top: 8px; font: 800 14px Pretendard, sans-serif; color: var(--teal); }
    .tally { display: grid; gap: 5px; margin-bottom: 12px; }
    .tally div { display: flex; align-items: center; gap: 8px; font: 600 13px Pretendard, sans-serif; }
    .hidden { display: none !important; }
    @media (max-width: 620px) {
      .hud-title { display: none; }
      .chip { padding: 5px 9px; gap: 5px; }
      .chip.gold .value { font-size: 24px; }
      .chip.time { min-width: 110px; }
      .card { padding: 18px; }
      .card h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="hud-left">
        <span class="hud-title">PRISM TYCOON</span>
      </div>
      <div class="chip gold" id="chip-gold"><span class="label">금화</span><span class="value" id="hud-gold">0</span></div>
      <div class="hud-right">
        <div class="chip time" id="chip-time">
          <div class="time-top">
            <span class="label">시간</span>
            <span class="value" id="hud-time">5:00</span>
          </div>
          <div class="time-gauge"><b id="hud-time-fill"></b></div>
        </div>
      </div>
    </div>

    <div class="shop hidden" id="shop"><div id="shop-list"></div></div>

    <div class="overlay" id="start-overlay">
      <div class="card">
        <h1>PRISM TYCOON</h1>
        <p class="tagline">줍고 · 넣고 · 꺼내고 · 팔아서 공장을 키우세요</p>
        <div class="flow">
          <div><span>⛏️</span><b>광맥</b><span>밟으면 원석이 등에 쌓입니다</span></div>
          <div><span>🏭</span><b>기계</b><span>↓에 넣고 ↑에서 꺼냅니다</span></div>
          <div><span>💰</span><b>판매대</b><span>쌓인 보석을 팝니다</span></div>
          <div><span>⬆️</span><b>업그레이드</b><span>기계 앞에서 사고 강화합니다</span></div>
        </div>
        <div class="note">어떤 기계가 어떤 모양을 만드는지는 직접 알아내세요. WASD·드래그로 이동.</div>
        <button class="btn-main" id="btn-start">게임 시작</button>
      </div>
    </div>

    <div class="overlay hidden" id="result-overlay">
      <div class="card">
        <h2>공방 마감!</h2>
        <div class="final">
          <div class="big" id="final-gold">0💰</div>
          <div class="sub">5분간 모은 금화</div>
          <div class="record hidden" id="record-badge">🏆 최고 기록 달성!</div>
          <div class="sub" id="best-line">최고 기록 0💰</div>
        </div>
        <div class="tally" id="tally"></div>
        <div class="note" id="closing-note"></div>
        <button class="btn-main" id="btn-restart">다시 도전하기</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    const cv = document.getElementById('game');
    const ctx = cv.getContext('2d');

    const MAP_W = 1000, MAP_H = 640;
    const GAME_TIME = 300;
    const CAPACITY_BASE = 16;
    const BAG_STEP = 10;
    const BAG_COSTS = [100, 200, 340, 520, 780];
    const STACK_MAX_H = 160;
    const SPEED = 230;
    const MINE_INTERVAL = 0.2;
    const DEPOSIT_INTERVAL = 0.12;
    const COLLECT_INTERVAL = 0.12;
    const PROCESS_BASE = 1.25;
    const SELL_INTERVAL = 0.14;
    const MORPH_TIME = 0.28;
    const GEM_S = 11;
    const STACK_STEP = 10;
    const GEM_STACK_S = 11;
    const FLY_DUR = 0.34;
    const PLAYER_R = 16;
    const BILL_STEP = 8;
    const EVENT_GAP_MIN = 36;
    const EVENT_GAP_MAX = 62;
    const BEST_KEY = 'prism-tycoon-best';
    const CAT_SIZE = 52;
    const WALK_FPS = 9;

    // Yard pads — WOS-ad style: stand on dotted square to interact.
    const YARD = { x: 56, y: 110, w: 888, h: 470 };
    const MINE_VEIN = { x: 88, y: 390, w: 120, h: 120 };
    const MARKET_PAD = { x: 790, y: 390, w: 120, h: 120 };
    const BAG_PAD = { x: 88, y: 250, w: 120, h: 72 };
    const CASH_ANCHOR = {
      x: MARKET_PAD.x - 28,
      y: MARKET_PAD.y + MARKET_PAD.h - 6
    };
    // Sell conveyor: intake on pad → ride into stall → sink (then bills spawn)
    const BELT = {
      start: { x: MARKET_PAD.x + 18, y: MARKET_PAD.y + MARKET_PAD.h - 16 },
      end: { x: MARKET_PAD.x + MARKET_PAD.w * 0.58, y: MARKET_PAD.y + 10 },
      sink: { x: MARKET_PAD.x + MARKET_PAD.w * 0.58, y: MARKET_PAD.y - 22 }
    };
    const CONVEY_HOP = 0.42;
    const CONVEY_BELT = 0.78;
    const CONVEY_DROP = 0.32;

    const BOUNDS = { x0: 70, x1: 930, y0: 140, y1: 560 };

    function carryCap(s) {
      return CAPACITY_BASE + s.bagLevel * BAG_STEP;
    }

    function bagMax() {
      return BAG_COSTS.length;
    }

    function mMax(m) {
      return m.costs.length;
    }

    function kioskRect(m) {
      // First buy: input shelf. Upgrade: dedicated [+] pad beside the shed.
      if (mLv(m.id) < 1) return m.input;
      return m.upgrade;
    }

    // body = solid (no walk-through). input/output = walkable shelves.
    // One shared shed: raw→trap and trap→para (사다리꼴·평행사변형 통일).
    const MACHINES = [
      { id: 'parallel', name: '나란히 틀', costs: [100, 120, 200, 320, 480], req: null,
        body: { x: 268, y: 320, w: 112, h: 68 },
        input: { x: 246, y: 396, w: 156, h: 48 },
        output: { x: 246, y: 266, w: 156, h: 48 },
        ops: { raw: 'trap', trap: 'para' }, sign: ['raw', 'para'] },
      { id: 'adjacent', name: '이웃 변 룬', costs: [420, 180, 300, 460, 700], req: 'parallel',
        body: { x: 538, y: 208, w: 120, h: 68 },
        input: { x: 516, y: 284, w: 164, h: 48 },
        output: { x: 516, y: 154, w: 164, h: 48 },
        ops: { para: 'rhombus', rect: 'square' }, sign: ['para', 'rhombus'] },
      { id: 'right', name: '직각 룬', costs: [420, 180, 300, 460, 700], req: 'parallel',
        body: { x: 538, y: 420, w: 120, h: 68 },
        input: { x: 516, y: 496, w: 164, h: 48 },
        output: { x: 516, y: 366, w: 164, h: 48 },
        ops: { para: 'rect', rhombus: 'square' }, sign: ['para', 'rect'] }
    ];

    MACHINES.forEach((m) => {
      // [+] on the OUTER flank of each factory — never in the shared center aisle
      // (left column → left of shelf, right column → right of shelf).
      const leftCol = m.body.x < 400;
      m.upgrade = leftCol
        ? { x: m.input.x - 56, y: m.input.y, w: 48, h: 48 }
        : { x: m.input.x + m.input.w + 8, y: m.input.y, w: 48, h: 48 };
      m.area = {
        x: Math.min(m.body.x, m.input.x, m.output.x, m.upgrade.x) - 4,
        y: Math.min(m.body.y, m.input.y, m.output.y, m.upgrade.y) - 8,
        w: Math.max(m.body.x + m.body.w, m.input.x + m.input.w, m.output.x + m.output.w, m.upgrade.x + m.upgrade.w)
          - Math.min(m.body.x, m.input.x, m.output.x, m.upgrade.x) + 8,
        h: Math.max(m.body.y + m.body.h, m.input.y + m.input.h, m.output.y + m.output.h, m.upgrade.y + m.upgrade.h)
          - Math.min(m.body.y, m.input.y, m.output.y, m.upgrade.y) + 12
      };
    });

    function shelfSlot(pad, i) {
      const cols = Math.max(5, Math.floor((pad.w - 14) / 13));
      const col = i % cols;
      const row = Math.floor(i / cols);
      return {
        x: pad.x + 14 + col * 13 + row * 2.5,
        y: pad.y + pad.h - 14 - row * 9 - col * 0.9
      };
    }

    function circleHitsRect(x, y, r, b) {
      const cx = Math.max(b.x, Math.min(x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(y, b.y + b.h));
      const dx = x - cx, dy = y - cy;
      return dx * dx + dy * dy < r * r;
    }

    function blockedAt(x, y) {
      // Collision covers footprint + right-side wall volume so the shed feels solid.
      return MACHINES.some((m) => {
        const b = m.body;
        return circleHitsRect(x, y, PLAYER_R, { x: b.x, y: b.y, w: b.w + 22, h: b.h });
      });
    }

    function movePlayer(dx, dy, dt) {
      const p = state.player;
      let nx = p.x + dx * SPEED * dt;
      let ny = p.y + dy * SPEED * dt;
      nx = Math.max(BOUNDS.x0, Math.min(BOUNDS.x1, nx));
      ny = Math.max(BOUNDS.y0, Math.min(BOUNDS.y1, ny));
      if (!blockedAt(nx, p.y)) p.x = nx;
      if (!blockedAt(p.x, ny)) p.y = ny;
    }

    function easeOutCubic(t) {
      const u = Math.min(1, Math.max(0, t));
      return 1 - Math.pow(1 - u, 3);
    }

    function startFly(g, x0, y0, x1, y1) {
      g.fly = { x0, y0, x1, y1, t: 0 };
      g.settle = 0;
    }

    function flyDone(g) {
      return !g.fly || g.fly.t >= 1;
    }

    function shelfReady(g) {
      return flyDone(g) && (g.settle || 0) >= 0.2;
    }

    function tickFly(g, dt) {
      if (g.fly) {
        g.fly.t = Math.min(1, g.fly.t + dt / FLY_DUR);
        if (g.fly.t >= 1) { g.fly = null; g.settle = 0; }
      } else {
        g.settle = (g.settle || 0) + dt;
      }
    }

    function flyPos(g, fallback) {
      if (g.fly) {
        const e = easeOutCubic(g.fly.t);
        const arc = Math.sin(e * Math.PI) * 36;
        return {
          x: g.fly.x0 + (g.fly.x1 - g.fly.x0) * e,
          y: g.fly.y0 + (g.fly.y1 - g.fly.y0) * e - arc
        };
      }
      return fallback;
    }

    function carryTopPos(p) {
      const n = state.carry.length;
      return {
        x: p.x - p.facing * 16,
        y: p.y - 24 - (n > 0 ? stackStep(n - 1, n) : 0)
      };
    }

    // Same crystal body — kinds differ by silhouette and border only (fill never changes).
    const GEM_FILL = '#e9d5ff';
    const GEMS = {
      // props = [이등분, 직교, 등변]
      raw:     { name: '원석',       price: 9,   fill: GEM_FILL, line: '#1c1917', props: [0, 0, 0],
        diag: '특별한 성질 없음' },
      trap:    { name: '사다리꼴',   price: 22,  fill: GEM_FILL, line: '#15803d', props: [0, 0, 0],
        diag: '한 쌍의 대변이 평행' },
      para:    { name: '평행사변형', price: 38,  fill: GEM_FILL, line: '#1d4ed8', props: [1, 0, 0],
        diag: '대각선이 서로를 이등분' },
      rhombus: { name: '마름모',     price: 82,  fill: GEM_FILL, line: '#7c3aed', props: [1, 1, 0],
        diag: '대각선이 서로 수직이등분' },
      rect:    { name: '직사각형',   price: 82,  fill: GEM_FILL, line: '#b45309', props: [1, 0, 1],
        diag: '대각선이 이등분하고 길이가 같음' },
      square:  { name: '정사각형',   price: 240, fill: GEM_FILL, line: '#db2777', props: [1, 1, 1],
        diag: '대각선이 이등분·직교·길이 같음' }
    };

    // ---------- shapes ----------
    // Every gem is a quad with the same vertex order so morphing is a plain lerp.
    // seed varies proportions while keeping each kind's geometric identity.
    function hash(n) { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }

    function shapeFor(kind, s, seed) {
      const sd = seed == null ? 1 : seed;
      // Tiny jitter only — same kind must read as the same silhouette in the backpack.
      const j = (n, amt) => (hash(sd + n) - 0.5) * amt;

      if (kind === 'raw') {
        // Irregular nugget — only raw stays chunky/uneven
        const base = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
        return base.map((p, i) => [
          p[0] * s * (0.7 + hash(sd + i * 7.1) * 0.55),
          p[1] * s * (0.5 + hash(sd + i * 13.3) * 0.5)
        ]);
      }
      if (kind === 'trap') {
        // Broader than para (~2.6s wide) — long base always on the bottom
        const long = s * 2.85;
        const short = s * 1.15;
        const h = s * 0.52;
        const lean = j(1, 0.05) * s;
        return [
          [-short * 0.5 + lean, -h],
          [short * 0.5 + lean, -h],
          [long * 0.5, h],
          [-long * 0.5, h]
        ];
      }
      if (kind === 'rhombus') {
        const w = s * 0.88;
        const h = s * 1.08;
        return [[0, -h], [w, 0], [0, h], [-w, 0]];
      }
      if (kind === 'para') {
        const a = s * 0.95;
        const b = s * 0.55;
        const sh = s * 0.36;
        return [[-a - sh, -b], [a - sh, -b], [a + sh, b], [-a + sh, b]];
      }
      if (kind === 'rect') {
        const a = s * 1.05;
        const b = s * 0.58;
        return [[-a, -b], [a, -b], [a, b], [-a, b]];
      }
      const z = s * 0.78;
      return [[-z, -z], [z, -z], [z, z], [-z, z]];
    }

    function lerpPts(from, to, t) {
      return from.map((p, i) => [p[0] + (to[i][0] - p[0]) * t, p[1] + (to[i][1] - p[1]) * t]);
    }

    function svgFor(kind, size) {
      const outer = shapeFor(kind, size / 3.1, 1);
      const inner = outer.map((p) => [p[0] * 0.72, p[1] * 0.72]);
      const to = (pts) => pts.map((p) => `${(p[0] + size / 2).toFixed(1)},${(p[1] + size / 2).toFixed(1)}`).join(' ');
      const g = GEMS[kind];
      const h = hash(1);
      const glow = h < 0.34 ? '#c4b5fd' : h < 0.67 ? '#5eead4' : '#fbbf24';
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
        <polygon points="${to(outer)}" fill="#3f322e" stroke="${g.line}" stroke-width="1.4"/>
        <polygon points="${to(inner)}" fill="${glow}" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"/></svg>`;
    }

    function stripBlack(img) {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth || img.width;
      c.height = img.naturalHeight || img.height;
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      try {
        const data = g.getImageData(0, 0, c.width, c.height);
        const px = data.data;
        for (let i = 0; i < px.length; i += 4) {
          // Soft edge: near-black becomes transparent so the satchel doesn't keep a matte halo.
          const dark = Math.max(px[i], px[i + 1], px[i + 2]);
          if (dark < 22) px[i + 3] = 0;
          else if (dark < 42) px[i + 3] = Math.min(px[i + 3], Math.floor((dark - 22) * 12));
        }
        g.putImageData(data, 0, 0);
        return trimCanvas(c);
      } catch (e) {
        // file:// 프로토콜에서는 getImageData()가 SecurityError를 던짐.
        // 픽셀 처리 없이 canvas를 그대로 반환 (스프라이트는 정상 표시됨).
        return c;
      }
    }

    function trimCanvas(src) {
      const g = src.getContext('2d');
      const { width: w, height: h } = src;
      let data;
      try {
        data = g.getImageData(0, 0, w, h).data;
      } catch (e) {
        return src; // file:// 환경에서 SecurityError 시 원본 반환
      }
      let x0 = w, y0 = h, x1 = 0, y1 = 0, found = false;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (data[(y * w + x) * 4 + 3] > 12) {
          found = true;
          if (x < x0) x0 = x; if (y < y0) y0 = y;
          if (x > x1) x1 = x; if (y > y1) y1 = y;
        }
      }
      if (!found) return src;
      const pad = 2;
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
      x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
      const out = document.createElement('canvas');
      out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
      out.getContext('2d').drawImage(src, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
      return out;
    }

    function loadImg(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          try { resolve(stripBlack(img)); } catch (e) { resolve(img); }
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    // cols×rows 스프라이트 시트(투명 PNG)를 로드해 각 셀을 개별 canvas로 슬라이싱.
    function loadSheet(src, cols = 4, rows = 4) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          const fw = Math.floor(w / cols);
          const fh = Math.floor(h / rows);
          const frames = [];
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const c = document.createElement('canvas');
              c.width = fw; c.height = fh;
              c.getContext('2d').drawImage(img, col * fw, row * fh, fw, fh, 0, 0, fw, fh);
              frames.push(c);
            }
          }
          resolve({ idle: frames[0], walk: frames.slice(cols) });
        };
        img.onerror = () => {
          console.warn('loadSheet error loading:', src);
          resolve(null);
        };
        img.src = src;
      });
    }

    // ---------- 냥순이 sprites ----------
    const ASSET_DIR = (function() {
      let path = window.location.pathname || '';
      if (!path.endsWith('/')) {
        const last = path.lastIndexOf('/');
        path = last >= 0 ? path.substring(0, last + 1) : '';
      }
      return path + 'assets/';
    })();

    const DIRS_8 = ['right','down-right','down','down-left','left','up-left','up','up-right'];
    const art = {
      dirs: Object.fromEntries(DIRS_8.map((d) => [d, { idle: null, walk: [] }])),
      catAspect: 1,
      hall: null,
      idle: null,
      walk: []
    };

    const MIRROR_MAP = { 'left': 'right', 'down-left': 'down-right', 'up-left': 'up-right' };

    async function loadArt8Dir() {
      const SHEET_FILES = {
        'right':      ASSET_DIR + 'nyangsooni-right.png',
        'down':       ASSET_DIR + 'nyangsooni-down.png',
        'up':         ASSET_DIR + 'nyangsooni-up.png',
        'down-right': ASSET_DIR + 'nyangsooni-down-right.png',
        'up-right':   ASSET_DIR + 'nyangsooni-up-right.png',
      };

      const results = await Promise.all(
        Object.entries(SHEET_FILES).map(([dir, src]) =>
          loadSheet(src).then((sheet) => ({ dir, sheet }))
        )
      );

      results.forEach(({ dir, sheet }) => {
        if (sheet) art.dirs[dir] = sheet;
      });

      const ref = art.dirs['right']?.idle;
      if (ref) art.catAspect = ref.height / ref.width;
    }

    async function loadArt() {
      const hallPromise = new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = ASSET_DIR + 'hall-bg.png';
      });

      const [hall] = await Promise.all([hallPromise, loadArt8Dir()]);
      art.hall = hall;
    }

    // catImg: { img, mirror } 반환. mirror=true 이면 drawPlayer에서 ctx.scale(-1,1) 적용.
    function catImg(p) {
      const dir = p.dir || (p.facing >= 0 ? 'right' : 'left');
      const mirror = dir in MIRROR_MAP;
      const lookupDir = MIRROR_MAP[dir] || dir;

      const slot = art.dirs[lookupDir];
      const fallbackWalk = art.walk;
      const fallbackIdle = art.idle;

      let img;
      if (p.moving) {
        const walk = slot?.walk?.length ? slot.walk : fallbackWalk;
        if (walk.length) {
          const frame = Math.floor(p.walkT * WALK_FPS) % walk.length;
          img = walk[frame] || slot?.idle || fallbackIdle;
        } else {
          img = slot?.idle || fallbackIdle;
        }
      } else {
        img = slot?.idle || fallbackIdle || slot?.walk?.[0] || fallbackWalk[0];
      }

      return { img, mirror };
    }

    // ---------- state ----------
    let state = null;
    let last = 0;
    let uiHits = [];

    function recordHit(r, fn) { uiHits.push({ r, fn }); }

    function mLv(id) { return state.owned[id] || 0; }

    function ensureWorkshops(s) {
      MACHINES.forEach((m) => {
        if (!s.workshops[m.id]) s.workshops[m.id] = { queue: [], processing: [], output: [] };
      });
    }

    function processTime(id) {
      const lv = mLv(id);
      return PROCESS_BASE / (1 + 0.28 * Math.max(0, lv - 1));
    }

    function processSlots(id) {
      const lv = Math.max(1, mLv(id));
      return Math.min(5, lv);
    }

    function queueCap(id) {
      const lv = Math.max(1, mLv(id));
      // ★1:10 … ★5:30 — each upgrade clearly holds more
      return 6 + lv * 5;
    }

    function depositRate(id) {
      return DEPOSIT_INTERVAL / (1 + 0.28 * Math.max(0, mLv(id) - 1));
    }

    function collectRate(id) {
      return COLLECT_INTERVAL / (1 + 0.25 * Math.max(0, mLv(id) - 1));
    }

    function stackStep(index) {
      return index * STACK_STEP;
    }

    function machineAtKiosk(p) {
      return MACHINES.find((m) => inRect(p, kioskRect(m)));
    }

    function orePileAnchor() {
      const v = MINE_VEIN;
      return { cx: v.x + v.w * 0.58, cy: v.y + v.h * 0.78, rx: 54, ry: 22 };
    }

    const ORE_REST = 18;

    function seedOrePile() {
      const a = orePileAnchor();
      const list = [];
      for (let i = 0; i < ORE_REST; i++) {
        const ang = hash(i * 9.1) * Math.PI * 2;
        const rad = Math.sqrt(hash(i * 4.7));
        list.push({
          x: a.cx + Math.cos(ang) * a.rx * rad * 0.95,
          y: a.cy + Math.sin(ang) * a.ry * rad - (1 - rad) * 34,
          vx: 0, vy: 0,
          seed: 40 + i * 13,
          settled: true
        });
      }
      return list;
    }

    function spawnOreFromCave(s, n) {
      const v = MINE_VEIN;
      const flying = s.oreSpill.filter((o) => !o.settled).length;
      n = Math.min(n, Math.max(0, 6 - flying));
      for (let i = 0; i < n; i++) {
        const k = hash(s.oreSpill.length * 1.7 + i * 11.3 + (s.seed || 1));
        s.oreSpill.push({
          x: v.x - 16 + k * 10,
          y: v.y + 12 + hash(k * 17) * 16,
          vx: 90 + hash(k * 3) * 80,
          vy: 10 + hash(k * 8) * 40,
          seed: 70 + Math.floor(k * 400),
          settled: false
        });
      }
    }

    function pluckOreFromPile(s) {
      const p = s.player;
      let best = -1, bestD = 1e9;
      s.oreSpill.forEach((o, i) => {
        if (!o.settled) return;
        const d = (o.x - p.x) * (o.x - p.x) + (o.y - p.y) * (o.y - p.y);
        if (d < bestD) { bestD = d; best = i; }
      });
      if (best >= 0) s.oreSpill.splice(best, 1);
    }

    function tickOreSpill(s, dt) {
      if (!s.oreSpill) s.oreSpill = seedOrePile();
      const v = MINE_VEIN;
      const a = orePileAnchor();
      s.oreSpill.forEach((o) => {
        if (o.settled) return;
        o.vy += 320 * dt;
        o.x += o.vx * dt;
        o.y += o.vy * dt;
        o.vx *= 0.985;
        const dx = (o.x - a.cx) / a.rx;
        const mound = a.cy - Math.max(0, 1 - dx * dx) * 36;
        if (Math.abs(dx) < 1.12 && o.y >= mound && o.vy > 0) {
          o.y = mound;
          o.settled = true;
          o.vx = 0;
          o.vy = 0;
        } else if (o.y > v.y + v.h + 10) {
          o.settled = true;
          o.y = v.y + v.h - 6 - hash(o.seed) * 8;
          o.vx = 0;
          o.vy = 0;
        }
      });
      let settled = 0;
      for (let i = s.oreSpill.length - 1; i >= 0; i--) {
        if (!s.oreSpill[i].settled) continue;
        settled++;
        if (settled > ORE_REST) s.oreSpill.splice(i, 1);
      }
    }

    function newState() {
      const s = {
        phase: 'ready',
        time: GAME_TIME,
        gold: 0,
        player: { x: 220, y: 470, facing: -1, dir: 'left', walkT: 0, moving: false },
        carry: [],
        bagLevel: 0,
        owned: { parallel: 0, adjacent: 0, right: 0 },
        workshops: {},
        sold: {},
        mineT: 0, depositT: 0, collectT: 0, sellT: 0, bagT: 0, buyT: {},
        earnFlash: 0, lastEarn: 0, poorFlash: 0,
        fullFlash: 0, fullRest: 0, warnKey: '', warnKeys: [],

        appraisal: null,
        floaters: [],
        sparks: [],
        dust: [],
        oreSpill: seedOrePile(),
        oreSpawnT: 0,
        bills: [],
        convey: [],
        glow: { parallel: 0, adjacent: 0, right: 0 },
        shake: 0,
        order: null,
        orderFlash: 0,
        eventWait: 24 + Math.random() * 18,
        seed: 1,
        lessons: { parallel: false },
        cutLesson: null,
        targetPos: null,
        ripples: []
      };
      ensureWorkshops(s);
      return s;
    }

    function producible(owned) {
      const list = ['raw'];
      if (owned.parallel >= 1) {
        list.push('trap');
        list.push('para');
      }
      if (owned.adjacent >= 1) list.push('rhombus');
      if (owned.right >= 1) list.push('rect');
      if (owned.adjacent >= 1 && owned.right >= 1) list.push('square');
      return list;
    }

    function maybeRollEvent(s) {
      s.eventWait = EVENT_GAP_MIN + Math.random() * (EVENT_GAP_MAX - EVENT_GAP_MIN);
      if (Math.random() < 0.38) return;
      const pool = producible(s.owned).filter((k) => k !== 'raw');
      if (!pool.length) return;
      const kind = pool[Math.floor(Math.random() * pool.length)];
      const need = 1 + Math.floor(Math.random() * 3);
      const mult = 2 + Math.floor(Math.random() * 3);
      const maxT = 18 + Math.random() * 14;
      s.order = { kind, need, got: 0, mult, t: maxT, maxT };
      s.orderFlash = 1;
    }

    // ---------- view ----------
    let view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0 };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = cv.clientWidth, h = cv.clientHeight;
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const scale = Math.min(w / MAP_W, h / MAP_H) * 0.94;
      view = { scale, ox: (w - MAP_W * scale) / 2, oy: (h - MAP_H * scale) / 2, w, h };
    }
    window.addEventListener('resize', resize);

    // ---------- input ----------
    const keys = new Set();
    const KEY_MAP = {
      arrowup: 'u', w: 'u', arrowdown: 'd', s: 'd',
      arrowleft: 'l', a: 'l', arrowright: 'r', d: 'r'
    };
    window.addEventListener('keydown', (e) => {
      const k = KEY_MAP[e.key.toLowerCase()];
      if (k) { keys.add(k); e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      const k = KEY_MAP[e.key.toLowerCase()];
      if (k) keys.delete(k);
    });
    window.addEventListener('blur', () => keys.clear());

    let stick = null;
    const STICK_R = 56;

    function mapPointer(e) {
      return {
        x: (e.offsetX - view.ox) / view.scale,
        y: (e.offsetY - view.oy) / view.scale
      };
    }

    cv.addEventListener('pointerdown', (e) => {
      if (!state) return;
      if (state.phase === 'cutLesson') {
        onCutPointerDown(e);
        return;
      }
      if (stick || state.phase !== 'play') return;
      stick = { id: e.pointerId, bx: e.offsetX, by: e.offsetY, x: e.offsetX, y: e.offsetY, moved: false };
      cv.setPointerCapture(e.pointerId);
    });

    cv.addEventListener('pointermove', (e) => {
      if (state && state.phase === 'cutLesson') {
        onCutPointerMove(e);
        return;
      }
      if (stick && stick.id === e.pointerId) {
        stick.x = e.offsetX;
        stick.y = e.offsetY;
        if (Math.hypot(stick.x - stick.bx, stick.y - stick.by) > 10) {
          stick.moved = true;
          if (state) state.targetPos = null; // 조이스틱 드래그 시 탭 이동 자동 취소
        }
      }
    });

    const dropStick = (e) => {
      if (state && state.phase === 'cutLesson') {
        onCutPointerUp(e);
        return;
      }
      if (stick && stick.id === e.pointerId) {
        // 드래그 없이 탭(클릭)만 한 경우: 바닥 클릭 이동
        if (!stick.moved && state && state.phase === 'play') {
          const mx = (e.offsetX - view.ox) / view.scale;
          const my = (e.offsetY - view.oy) / view.scale;

          let hitUi = false;
          for (const h of uiHits) {
            const r = h.r;
            if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
              hitUi = true;
              h.fn();
              break;
            }
          }

          if (!hitUi) {
            const tx = Math.max(BOUNDS.x0 + 12, Math.min(BOUNDS.x1 - 12, mx));
            const ty = Math.max(BOUNDS.y0 + 12, Math.min(BOUNDS.y1 - 12, my));
            state.targetPos = { x: tx, y: ty };
            if (!state.ripples) state.ripples = [];
            state.ripples.push({ x: tx, y: ty, t: 0 });
          }
        }
        stick = null;
      }
    };
    cv.addEventListener('pointerup', dropStick);
    cv.addEventListener('pointercancel', dropStick);

    function moveVector() {
      let dx = 0, dy = 0;
      if (keys.has('l')) dx -= 1;
      if (keys.has('r')) dx += 1;
      if (keys.has('u')) dy -= 1;
      if (keys.has('d')) dy += 1;

      if (dx !== 0 || dy !== 0) {
        if (state) state.targetPos = null; // 키보드 입력 시 탭 이동 취소
      }

      if (stick) {
        const sx = stick.x - stick.bx, sy = stick.y - stick.by;
        const len = Math.hypot(sx, sy);
        if (len > 6) {
          if (state) state.targetPos = null;
          const k = Math.min(len, STICK_R) / STICK_R;
          dx += (sx / len) * k;
          dy += (sy / len) * k;
        }
      }

      // 조이스틱/키보드 입력이 없고 클릭 목표 위치가 설정된 경우
      if (dx === 0 && dy === 0 && state && state.targetPos) {
        const tdx = state.targetPos.x - state.player.x;
        const tdy = state.targetPos.y - state.player.y;
        const dist = Math.hypot(tdx, tdy);
        if (dist < 10) {
          state.targetPos = null; // 도착 완료
        } else {
          dx = tdx / dist;
          dy = tdy / dist;
        }
      }

      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      return [dx, dy];
    }

    function inRect(p, r) {
      return p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h;
    }

    // ---------- game logic ----------
    function addFloater(x, y, text, color, big) {
      state.floaters.push({ x, y, text, color, big: !!big, t: 0 });
    }

    function addSparks(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 40 + Math.random() * 90;
        state.sparks.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
          color, life: 0, max: 0.35 + Math.random() * 0.35, r: 2.2
        });
      }
    }

    // Cash vacuum FX — burst near 냥순이 so eating always reads on-screen.
    function addCashEatFx(billX, billY, color) {
      const p = state.player;
      const x = p.x - p.facing * 10;
      const y = p.y - 32;

      for (let i = 0; i < 6; i++) {
        const a = -0.4 + Math.random() * (Math.PI + 0.8);
        const sp = 45 + Math.random() * 95;
        state.sparks.push({
          x: x + (Math.random() - 0.5) * 10,
          y: y + (Math.random() - 0.5) * 8,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp * 0.5 - 20,
          color,
          life: 0,
          max: 0.38 + Math.random() * 0.28,
          r: 2.6 + Math.random() * 2.2
        });
      }
    }

    function update(dt) {
      const s = state;
      s.time -= dt;
      if (s.time <= 0) { s.time = 0; finish(); return; }

      if (s.order) {
        s.order.t -= dt;
        if (s.order.t <= 0) s.order = null;
      } else {
        s.eventWait -= dt;
        if (s.eventWait <= 0) maybeRollEvent(s);
      }

      const [dx, dy] = moveVector();
      movePlayer(dx, dy, dt);
      s.player.moving = Math.hypot(dx, dy) > 0.08;
      if (Math.abs(dx) > 0.08) s.player.facing = dx > 0 ? 1 : -1;
      if (s.player.moving) {
        // dx/dy → 8방향 문자열로 변환
        const angle = Math.atan2(dy, dx); // -π to π
        const idx = Math.round(((angle / (Math.PI * 2)) + 1) * 8) % 8;
        s.player.dir = DIRS_8[idx];
        s.player.walkT += dt;
      } else {
        s.player.walkT = 0;
      }
      if (s.player.moving && Math.random() < dt * 14) {
        s.dust.push({
          x: s.player.x - s.player.facing * 8,
          y: s.player.y + 2,
          vx: (Math.random() - 0.5) * 30,
          vy: -10 - Math.random() * 20,
          life: 0, max: 0.35 + Math.random() * 0.25
        });
      }

      if (inRect(s.player, MINE_VEIN)) {
        s.mineT += dt;
        while (s.mineT >= MINE_INTERVAL) {
          s.mineT -= MINE_INTERVAL;
          const cap = carryCap(s);
          if (s.carry.length >= cap) {
            s.mineT = 0;
            break;
          }
          const seed = s.seed++;
          s.carry.push({ kind: 'raw', seed, pts: shapeFor('raw', GEM_S, seed), from: null, to: null, t: 1 });
          pluckOreFromPile(s);
          spawnOreFromCave(s, Math.random() < 0.4 ? 2 : 1);
          addSparks(MINE_VEIN.x + MINE_VEIN.w / 2, MINE_VEIN.y + 20, '#a5b4fc', 3);
        }
      } else s.mineT = 0;

      // Deposit → shelf fan-out → process → output shelf → collect.
      ensureWorkshops(s);
      let onInput = false, onOutput = false;
      MACHINES.forEach((m) => {
        const lv = mLv(m.id);
        if (lv < 1) return;
        const ws = s.workshops[m.id];
        const cap = queueCap(m.id);
        const outCap = cap;
        const bodyCx = m.body.x + m.body.w / 2;
        const bodyCy = m.body.y + m.body.h / 2;

        ws.queue.forEach((g) => tickFly(g, dt));
        ws.output.forEach((g) => tickFly(g, dt));

        if (inRect(s.player, m.input)) {
          if (m.id === 'parallel' && !s.lessons.parallel && s.phase === 'play') {
            let rawI = -1;
            for (let i = s.carry.length - 1; i >= 0; i--) {
              if (s.carry[i].kind === 'raw' && flyDone(s.carry[i])) { rawI = i; break; }
            }
            if (rawI >= 0) {
              const raw = s.carry.splice(rawI, 1)[0];
              startCutLesson(raw.seed);
              return;
            }
          }
          onInput = true;
          s.depositT += dt;
          while (s.depositT >= depositRate(m.id)) {
            s.depositT -= depositRate(m.id);
            const totalIn = ws.queue.length + ws.processing.length;
            if (totalIn >= cap) break;
            let idx = -1;
            for (let i = s.carry.length - 1; i >= 0; i--) {
              if (m.ops[s.carry[i].kind] && flyDone(s.carry[i])) { idx = i; break; }
            }
            if (idx < 0) break;
            const from = {
              x: s.player.x - s.player.facing * 16,
              y: s.player.y - 24 - stackStep(idx, s.carry.length)
            };
            const g = s.carry.splice(idx, 1)[0];
            const slot = shelfSlot(m.input, ws.queue.length);
            startFly(g, from.x, from.y, slot.x, slot.y);
            ws.queue.push(g);
            addSparks(slot.x, slot.y, '#a5b4fc', 4);
          }
        }

        while (ws.processing.length < processSlots(m.id)) {
          const qi = ws.queue.findIndex((g) => shelfReady(g));
          if (qi < 0) break;
          const g = ws.queue.splice(qi, 1)[0];
          const next = m.ops[g.kind];
          ws.processing.push({
            kind: g.kind, seed: g.seed, target: next,
            pts: g.pts.slice(),
            from: g.pts.slice(),
            to: shapeFor(next, GEM_S, g.seed),
            t: 0, progress: 0
          });
        }

        ws.processing = ws.processing.filter((p) => {
          p.progress += dt / processTime(m.id);
          const e = Math.min(1, p.progress);
          const ease = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
          p.pts = lerpPts(p.from, p.to, ease);
          p.t = ease;
          if (p.progress >= 1) {
            if (ws.output.length >= outCap) return true;
            const out = { kind: p.target, seed: p.seed, pts: p.to.slice(), from: null, to: null, t: 1 };
            const slot = shelfSlot(m.output, ws.output.length);
            startFly(out, bodyCx, bodyCy, slot.x, slot.y);
            ws.output.push(out);
            s.glow[m.id] = 1;
            addSparks(slot.x, slot.y, GEMS[out.kind].line, 8);
            return false;
          }
          return true;
        });

        if (inRect(s.player, m.output) && ws.output.length) {
          onOutput = true;
          s.collectT += dt;
          while (s.collectT >= collectRate(m.id) && s.carry.length < carryCap(s)) {
            const oi = ws.output.findIndex((g) => shelfReady(g));
            if (oi < 0) break;
            s.collectT -= collectRate(m.id);
            const g = ws.output.splice(oi, 1)[0];
            const from = shelfSlot(m.output, oi);
            const n = s.carry.length;
            const to = {
              x: s.player.x - s.player.facing * 16,
              y: s.player.y - 24 - stackStep(n, n + 1)
            };
            startFly(g, from.x, from.y, to.x, to.y);
            s.carry.push(g);
            addSparks(to.x, to.y, '#fde68a', 5);
          }
        }
      });
      if (!onInput) s.depositT = 0;
      if (!onOutput) s.collectT = 0;
      s.carry.forEach((g) => tickFly(g, dt));

      // Stand on buy pad → auto-pay when you have enough gold (WOS plaque feel).
      let onBuy = false;
      MACHINES.forEach((m) => {
        const lv = mLv(m.id);
        if (lv >= mMax(m)) return;
        if (m.req && mLv(m.req) < 1) return;
        if (!inRect(s.player, kioskRect(m))) return;
        onBuy = true;
        const cost = m.costs[lv];
        if (s.gold < cost) {
          s.buyT[m.id] = 0;
          s.poorFlash = Math.max(s.poorFlash, 0.55);
          return;
        }
        s.buyT[m.id] = (s.buyT[m.id] || 0) + dt;
        if (s.buyT[m.id] >= 0.75) {
          s.buyT[m.id] = 0;
          buy(m);
        }
      });
      if (!onBuy) {
        for (const id in s.buyT) s.buyT[id] = 0;
      }

      // Stand on bag pad to upgrade capacity.
      if (s.bagLevel < bagMax() && inRect(s.player, BAG_PAD)) {
        const bagCost = BAG_COSTS[s.bagLevel];
        if (s.gold >= bagCost) {
          s.bagT += dt;
          if (s.bagT >= 0.7) { s.bagT = 0; buyBag(); }
        } else {
          s.bagT = 0;
          s.poorFlash = Math.max(s.poorFlash, 0.55);
        }
      } else s.bagT = 0;

      if (inRect(s.player, MARKET_PAD)) {
        s.sellT += dt;
        while (s.sellT >= SELL_INTERVAL) {
          s.sellT -= SELL_INTERVAL;
          if (!s.carry.length) { s.sellT = 0; break; }
          const gem = s.carry.shift();
          const ord = s.order;
          const wanted = ord && gem.kind === ord.kind && ord.got < ord.need;
          const mult = wanted ? ord.mult : 1;
          const value = GEMS[gem.kind].price * mult;
          s.sold[gem.kind] = (s.sold[gem.kind] || 0) + 1;
          if (s.appraisal && s.appraisal.kind === gem.kind) {
            s.appraisal.life = 0;
            s.appraisal.value = value;
            s.appraisal.wanted = wanted;
            s.appraisal.mult = mult;
          } else {
            s.appraisal = { kind: gem.kind, seed: gem.seed, value, wanted, mult, t: 0, life: 0 };
          }
          let bonus = 0;
          if (wanted) {
            s.shake = Math.max(s.shake, 0.22);
            ord.got++;
            if (ord.got >= ord.need) {
              bonus = Math.floor(GEMS[ord.kind].price * ord.mult * 0.5);
              addFloater(s.player.x, s.player.y - 72, '완료!', '#f472b6', true);
              s.order = null;
              s.eventWait = EVENT_GAP_MIN + Math.random() * 12;
            }
          }
          // Tease: gem rides the belt before any cash appears.
          s.convey.push({
            kind: gem.kind,
            seed: gem.seed,
            value,
            wanted: !!wanted,
            bonus,
            phase: 'hop',
            t: 0,
            from: {
              x: s.player.x - s.player.facing * 10,
              y: s.player.y - 28
            }
          });
          addSparks(s.player.x, s.player.y - 20, wanted ? '#f9a8d4' : '#fde68a', wanted ? 8 : 4);
        }
      } else s.sellT = 0;

      updateConvey(dt);
      updateBills(dt);

      s.earnFlash = Math.max(0, s.earnFlash - dt);
      s.poorFlash = Math.max(0, s.poorFlash - dt);
      updateFullWarn(dt);


      for (const gem of s.carry) {
        if (gem.t < 1) {
          gem.t = Math.min(1, gem.t + dt / MORPH_TIME);
          const e = gem.t < 0.5 ? 2 * gem.t * gem.t : 1 - Math.pow(-2 * gem.t + 2, 2) / 2;
          gem.pts = lerpPts(gem.from, gem.to, e);
        }
      }
      for (const id in s.glow) s.glow[id] = Math.max(0, s.glow[id] - dt * 2.4);
      if (s.appraisal) {
        s.appraisal.t += dt;
        s.appraisal.life += dt;
        if (s.appraisal.life > 2.8) s.appraisal = null;
      }
      s.floaters = s.floaters.filter((f) => (f.t += dt) < 1);
      s.sparks = s.sparks.filter((sp) => {
        sp.life += dt;
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        sp.vy += 180 * dt;
        return sp.life < sp.max;
      });
      s.dust = s.dust.filter((d) => {
        d.life += dt;
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        return d.life < d.max;
      });
      if (s.ripples) {
        s.ripples = s.ripples.filter((r) => (r.t += dt * 2.4) < 1);
      }
      s.shake = Math.max(0, s.shake - dt);
      s.orderFlash = Math.max(0, s.orderFlash - dt * 1.6);

      updateHud();
      updateShopAtMachine();
    }

    function buyBag() {
      if (state.bagLevel >= bagMax()) return;
      const cost = BAG_COSTS[state.bagLevel];
      if (state.gold < cost) {
        state.poorFlash = Math.max(state.poorFlash, 0.7);
        return;
      }
      state.gold -= cost;
      state.bagLevel++;
      addFloater(state.player.x, state.player.y - 50, '가방+' + carryCap(state), '#5eead4', true);
      addSparks(state.player.x, state.player.y - 30, '#5eead4', 10);
    }

    // Stuck / blocked feedback: blink red ~1s, rest ~0.9s, repeat.
    // - carry: backpack full at mine / output
    // - in:id: deposit shelf full (can't feed the machine)
    // - out:id: collect shelf full (processing can't finish)
    function updateFullWarn(dt) {
      const s = state;
      const keys = [];
      const carryFull = s.carry.length >= carryCap(s) && s.carry.length > 0;

      if (carryFull && inRect(s.player, MINE_VEIN)) keys.push('carry');

      MACHINES.forEach((m) => {
        if (mLv(m.id) < 1) return;
        const ws = s.workshops[m.id];
        if (!ws) return;
        const cap = queueCap(m.id);
        const inFull = (ws.queue.length + ws.processing.length) >= cap;
        const outFull = ws.output.length >= cap;
        const outBlocked = outFull && ws.processing.some((p) => p.progress >= 0.98);

        // Always signal shelves that are blocking production.
        if (inFull) keys.push('in:' + m.id);
        if (outFull || outBlocked) keys.push('out:' + m.id);

        if (carryFull && inRect(s.player, m.output) && ws.output.length) keys.push('carry');
      });

      s.warnKeys = keys;
      if (!keys.length) {
        s.fullFlash = 0;
        s.fullRest = 0;
        s.warnKey = '';
        return;
      }

      const sig = keys.slice().sort().join('|');
      if (sig !== s.warnKey) {
        s.warnKey = sig;
        s.fullFlash = 1.0;
        s.fullRest = 0;
        return;
      }
      if (s.fullFlash > 0) {
        s.fullFlash -= dt;
        if (s.fullFlash <= 0) {
          s.fullFlash = 0;
          s.fullRest = 0.9;
        }
        return;
      }
      if (s.fullRest > 0) {
        s.fullRest -= dt;
        return;
      }
      s.fullFlash = 1.0;
    }

    function warnOn(key) {
      return state.fullFlash > 0 && state.warnKeys && state.warnKeys.indexOf(key) >= 0;
    }

    function warnPulse() {
      return 0.4 + 0.6 * Math.sin(performance.now() / 120);
    }

    function drawWarnGem(kind, seed, size) {
      const pulse = warnPulse();
      const fill = `rgba(251,113,133,${0.55 + pulse * 0.45})`;
      const line = `rgba(254,202,202,${0.75 + pulse * 0.25})`;
      paintGem(kind, size, seed, { fill, line, lw: 2.6 });
    }

    function paintGem(kind, size, seed, opt) {
      const g = GEMS[kind];
      const line = (opt && opt.line) || g.line;
      const pts = shapeFor(kind, size, seed);
      const lw = (opt && opt.lw) || 2.8;
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      if (opt && opt.fill) {
        poly(pts, opt.fill, line, lw);
      } else {
        const h = hash(seed || 1);
        const glow = h < 0.34 ? '#c4b5fd' : h < 0.67 ? '#5eead4' : '#fbbf24';
        const halo = h < 0.34 ? 'rgba(196,181,253,0.35)' : h < 0.67 ? 'rgba(94,234,212,0.35)' : 'rgba(251,191,36,0.35)';
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.ellipse(0, 2, size * 0.85, size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        poly(pts, '#3f322e', line, lw);
        const inner = pts.map((p) => [p[0] * 0.72, p[1] * 0.72]);
        poly(inner, glow, 'rgba(255,255,255,0.35)', 0.9);
        ctx.fillStyle = 'rgba(255,255,255,0.62)';
        ctx.beginPath();
        ctx.moveTo(inner[0][0] * 0.55, inner[0][1] * 0.55);
        ctx.lineTo(inner[1][0] * 0.45, inner[1][1] * 0.45);
        ctx.lineTo(inner[2][0] * 0.22, inner[2][1] * 0.22);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.ellipse(-size * 0.22, -size * 0.28, size * 0.18, size * 0.12, -0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function spawnBills(total, wanted) {
      if (total <= 0) return;
      const s = state;
      // Many thin layers so the tower grows tall like a gem backpack.
      const unit = total >= 100 ? 8 : total >= 40 ? 5 : total >= 15 ? 3 : 1;
      let left = total;
      let stagger = 0;
      const fromX = BELT.sink.x + (Math.random() - 0.5) * 8;
      const fromY = BELT.sink.y;
      while (left > 0) {
        const value = Math.min(unit, left);
        left -= value;
        const slot = s.bills.length;
        const target = cashSlot(slot);
        s.bills.push({
          value,
          wanted: !!wanted,
          fly: {
            x0: fromX + (Math.random() - 0.5) * 6,
            y0: fromY,
            x1: target.x,
            y1: target.y,
            t: -stagger
          },
          settle: 0
        });
        stagger += 0.045;
      }
    }

    function parabolaPos(a, b, t, lift) {
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t - Math.sin(Math.PI * t) * lift
      };
    }

    function conveyPos(c) {
      if (c.phase === 'hop') {
        const u = easeOutCubic(Math.min(1, c.t / CONVEY_HOP));
        return parabolaPos(c.from, BELT.start, u, 52);
      }
      if (c.phase === 'belt') {
        const raw = Math.min(1, c.t / CONVEY_BELT);
        // Ease then linger near the end — more “tease”
        const e = raw < 0.75
          ? (raw / 0.75) * (raw / 0.75) * (3 - 2 * (raw / 0.75)) * 0.88
          : 0.88 + (raw - 0.75) / 0.25 * 0.12;
        const x = BELT.start.x + (BELT.end.x - BELT.start.x) * e;
        const y = BELT.start.y + (BELT.end.y - BELT.start.y) * e
          + Math.sin(e * Math.PI * 4) * 1.6;
        return { x, y };
      }
      const u = Math.min(1, c.t / CONVEY_DROP);
      const ease = u * u * (3 - 2 * u);
      return parabolaPos(BELT.end, BELT.sink, ease, 34);
    }

    function updateConvey(dt) {
      const s = state;
      if (!s.convey.length) return;
      const kept = [];
      for (const c of s.convey) {
        c.t += dt;
        if (c.phase === 'hop') {
          if (c.t >= CONVEY_HOP) { c.phase = 'belt'; c.t = 0; }
          kept.push(c);
        } else if (c.phase === 'belt') {
          if (c.t >= CONVEY_BELT) { c.phase = 'drop'; c.t = 0; }
          kept.push(c);
        } else {
          if (c.t >= CONVEY_DROP) {
            spawnBills(c.value, c.wanted);
            if (c.bonus > 0) spawnBills(c.bonus, true);
            addSparks(BELT.sink.x, BELT.sink.y, c.wanted ? '#f9a8d4' : '#86efac', c.wanted ? 10 : 5);
            continue;
          }
          kept.push(c);
        }
      }
      s.convey = kept;
    }

    function cashSlot(index) {
      const sway = Math.sin(index * 0.7) * 1.8;
      return {
        x: CASH_ANCHOR.x + sway,
        y: CASH_ANCHOR.y - index * BILL_STEP
      };
    }

    function updateBills(dt) {
      const s = state;
      const p = s.player;
      s.bills.forEach((b) => {
        if (!b.fly) {
          b.settle = (b.settle || 0) + dt;
          return;
        }
        if (b.fly.t < 0) {
          b.fly.t += dt / FLY_DUR;
          return;
        }
        b.fly.t = Math.min(1, b.fly.t + dt / FLY_DUR);
        if (b.fly.t >= 1) {
          b.fly = null;
          b.settle = 0;
        }
      });

      // Eat landed bills while more are still flying in — walk over during the
      // stack-up. Carry OK; never vacuum while standing on the sell pad.
      const hasLanded = s.bills.some((b) => !b.fly && (b.settle || 0) >= 0.05);
      const selling = inRect(p, MARKET_PAD);
      const near = !selling
        && hasLanded
        && Math.hypot(p.x - CASH_ANCHOR.x, p.y - CASH_ANCHOR.y) < 72;
      if (!near) {
        s.cashT = 0;
        s.cashCombo = 0;
        return;
      }
      s.cashT = (s.cashT || 0) + dt;
      // Accelerate: start ~12/s, ramp toward ~90/s as combo grows.
      while (s.bills.length) {
        const combo = s.cashCombo || 0;
        const interval = Math.max(0.011, 0.085 / (1 + combo * 0.22));
        if (s.cashT < interval) break;
        let idx = -1;
        for (let i = s.bills.length - 1; i >= 0; i--) {
          const b = s.bills[i];
          if (!b.fly && (b.settle || 0) >= 0.05) { idx = i; break; }
        }
        if (idx < 0) break;
        s.cashT -= interval;
        s.cashCombo = combo + 1;
        const b = s.bills.splice(idx, 1)[0];
        s.gold += b.value;
        s.lastEarn = (s.earnFlash > 0 ? s.lastEarn : 0) + b.value;
        s.earnFlash = 1.0;
        const pos = cashSlot(idx);
        addCashEatFx(pos.x, pos.y, b.wanted ? '#f9a8d4' : '#86efac');
      }
    }

    function billDrawPos(b, index) {
      const slot = cashSlot(index, state.bills.length);
      if (b.fly) {
        if (b.fly.t < 0) return { x: b.fly.x0, y: b.fly.y0, flying: true };
        const e = easeOutCubic(Math.min(1, b.fly.t));
        // Retarget to current stack slot so the tower stays aligned as it grows.
        const x1 = slot.x, y1 = slot.y;
        const arc = Math.sin(e * Math.PI) * 48;
        return {
          x: b.fly.x0 + (x1 - b.fly.x0) * e,
          y: b.fly.y0 + (y1 - b.fly.y0) * e - arc,
          flying: true
        };
      }
      return { x: slot.x, y: slot.y, flying: false };
    }

    // ---------- drawing helpers ----------
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function poly(pts, fill, stroke, lw) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
    }

    function gemAt(kind, x, y, s, seed) {
      ctx.save();
      ctx.translate(x, y);
      paintGem(kind, s, seed || 1, null);
      ctx.restore();
    }

    // ---------- diagonal notation ----------
    // Ticks say "these pieces are the same length": one tick on all four halves means the
    // diagonals bisect each other AND match in length. A corner mark means they meet square.
    function segCross(a, b, c, d) {
      const r = [b[0] - a[0], b[1] - a[1]], s = [d[0] - c[0], d[1] - c[1]];
      const den = r[0] * s[1] - r[1] * s[0];
      if (!den) return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const t = ((c[0] - a[0]) * s[1] - (c[1] - a[1]) * s[0]) / den;
      return [a[0] + t * r[0], a[1] + t * r[1]];
    }

    function tickHalf(p, q, n, len) {
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      const dx = q[0] - p[0], dy = q[1] - p[1];
      const L = Math.hypot(dx, dy) || 1;
      const ux = dx / L, uy = dy / L;
      for (let i = 0; i < n; i++) {
        const off = (i - (n - 1) / 2) * 3.4;
        const cx = mx + ux * off, cy = my + uy * off;
        ctx.beginPath();
        ctx.moveTo(cx + uy * len, cy - ux * len);
        ctx.lineTo(cx - uy * len, cy + ux * len);
        ctx.stroke();
      }
    }

    function cornerMark(m, a, b, size) {
      const u = (p) => { const L = Math.hypot(p[0] - m[0], p[1] - m[1]) || 1; return [(p[0] - m[0]) / L, (p[1] - m[1]) / L]; };
      const [ax, ay] = u(a), [bx, by] = u(b);
      ctx.beginPath();
      ctx.moveTo(m[0] + ax * size, m[1] + ay * size);
      ctx.lineTo(m[0] + (ax + bx) * size, m[1] + (ay + by) * size);
      ctx.lineTo(m[0] + bx * size, m[1] + by * size);
      ctx.stroke();
    }

    function drawDiagonals(pts, props, progress) {
      const [bisect, perp, equal] = props;
      const m = segCross(pts[0], pts[2], pts[1], pts[3]);
      ctx.strokeStyle = 'rgba(248,250,252,0.9)';
      ctx.lineWidth = 1.8;
      [[0, 2], [1, 3]].forEach(([i, j]) => {
        ctx.beginPath();
        ctx.moveTo(pts[i][0], pts[i][1]);
        ctx.lineTo(pts[i][0] + (pts[j][0] - pts[i][0]) * progress, pts[i][1] + (pts[j][1] - pts[i][1]) * progress);
        ctx.stroke();
      });
      if (progress < 1) return;

      ctx.fillStyle = bisect ? '#5eead4' : '#fb7185';
      ctx.beginPath();
      ctx.arc(m[0], m[1], 3.4, 0, Math.PI * 2);
      ctx.fill();

      if (bisect) {
        ctx.strokeStyle = '#5eead4';
        ctx.lineWidth = 1.6;
        tickHalf(pts[0], m, 1, 4);
        tickHalf(pts[2], m, 1, 4);
        tickHalf(pts[1], m, equal ? 1 : 2, 4);
        tickHalf(pts[3], m, equal ? 1 : 2, 4);
      }
      if (perp) {
        ctx.strokeStyle = '#c4b5fd';
        ctx.lineWidth = 1.6;
        cornerMark(m, pts[0], pts[1], 7);
      }
    }

    // ---------- world (fantasy mine + factory floor) ----------
    function drawCrystalCluster(x, y, s) {
      for (let i = 0; i < 4; i++) {
        const ang = -Math.PI / 2 + (i - 1.5) * 0.38;
        ctx.fillStyle = i % 2 ? 'rgba(167,139,250,0.88)' : 'rgba(94,234,212,0.78)';
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(ang) * 4 * s, y - 28 * s + Math.sin(ang) * 3);
        ctx.lineTo(x + Math.cos(ang) * 16 * s + 6 * s, y + 4 * s);
        ctx.lineTo(x + Math.cos(ang) * 16 * s - 6 * s, y + 4 * s);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawOreChunk(x, y, s, seed, flying) {
      const h = hash(seed);
      const h2 = hash(seed + 3.1);
      const pts = [
        [-s * (0.7 + h * 0.4), -s * (0.55 + h2 * 0.35)],
        [s * (0.55 + h2 * 0.4), -s * (0.6 + h * 0.3)],
        [s * (0.75 + h * 0.25), s * (0.5 + h2 * 0.3)],
        [-s * (0.55 + h2 * 0.35), s * (0.62 + h * 0.25)]
      ];
      const glow = h < 0.34 ? '#c4b5fd' : h < 0.67 ? '#5eead4' : '#fbbf24';
      const deep = h < 0.34 ? '#5b21b6' : h < 0.67 ? '#0f766e' : '#b45309';
      ctx.save();
      ctx.translate(x, y);
      if (flying) ctx.rotate(h * 1.2 + (performance.now() / 160) * (h > 0.5 ? 1 : -1));
      ctx.fillStyle = flying ? 'rgba(255,255,255,0.28)' : 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(2, 7, s * 0.9, s * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = deep;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.moveTo(pts[0][0] * 0.72, pts[0][1] * 0.72);
      ctx.lineTo(pts[1][0] * 0.7, pts[1][1] * 0.7);
      ctx.lineTo(pts[2][0] * 0.55, pts[2][1] * 0.55);
      ctx.lineTo(pts[3][0] * 0.58, pts[3][1] * 0.58);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(-s * 0.14, -s * 0.2, s * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCaveRock(x, y, w, h, col) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x, y + h * 0.55);
      ctx.quadraticCurveTo(x + w * 0.15, y, x + w * 0.45, y + h * 0.12);
      ctx.quadraticCurveTo(x + w * 0.75, y - h * 0.08, x + w, y + h * 0.4);
      ctx.lineTo(x + w * 0.92, y + h);
      ctx.lineTo(x + w * 0.08, y + h);
      ctx.closePath();
      ctx.fill();
    }

    function drawDottedPad(r, hot, fillCol, strokeCol, icon) {
      ctx.fillStyle = hot ? fillCol : 'rgba(40,28,20,0.45)';
      roundRect(r.x, r.y, r.w, r.h, 10);
      ctx.fill();
      ctx.strokeStyle = hot ? strokeCol : 'rgba(226,232,240,0.45)';
      ctx.lineWidth = hot ? 3 : 2;
      ctx.setLineDash([7, 5]);
      roundRect(r.x, r.y, r.w, r.h, 10);
      ctx.stroke();
      ctx.setLineDash([]);
      if (icon) {
        ctx.fillStyle = hot ? strokeCol : 'rgba(226,232,240,0.7)';
        ctx.font = '800 13px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(icon, r.x + r.w / 2, r.y + 18);
        ctx.textAlign = 'left';
      }

    function drawProgressRing(cx, cy, r, p, color) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, p));
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.lineCap = 'butt';
    }

      [[108, 176, 9, 3], [168, 198, 7, 8], [92, 328, 8, 12],

    function drawMineVein() {

      ctx.fill();
      ctx.fillStyle = '#1a1024';
      ctx.beginPath();
      ctx.moveTo(v.x - 22, v.y + 88);
      ctx.quadraticCurveTo(v.x - 28, v.y - 8, v.x + 18, v.y - 6);
      ctx.quadraticCurveTo(v.x + 36, v.y + 20, v.x + 22, v.y + 92);

    function drawSellConveyor() {
      const a = BELT.start;
      const b = BELT.end;
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      const half = 11;
      const now = performance.now() / 1000;

      // Shadow under belt
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.moveTo(a.x + nx * half + 3, a.y + ny * half + 4);
      ctx.lineTo(b.x + nx * half + 3, b.y + ny * half + 4);
      ctx.lineTo(b.x - nx * half + 3, b.y - ny * half + 4);
      ctx.lineTo(a.x - nx * half + 3, a.y - ny * half + 4);
      ctx.closePath();
      ctx.fill();

      // Belt body
      const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g.addColorStop(0, '#3a4558');
      g.addColorStop(0.5, '#4b5568');
      g.addColorStop(1, '#334155');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(a.x + nx * half, a.y + ny * half);
      ctx.lineTo(b.x + nx * half, b.y + ny * half);
      ctx.lineTo(b.x - nx * half, b.y - ny * half);
      ctx.lineTo(a.x - nx * half, a.y - ny * half);
      ctx.closePath();
      ctx.fill();

      // Scrolling cleats
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(a.x + nx * half, a.y + ny * half);
      ctx.lineTo(b.x + nx * half, b.y + ny * half);
      ctx.lineTo(b.x - nx * half, b.y - ny * half);
      ctx.lineTo(a.x - nx * half, a.y - ny * half);
      ctx.closePath();
      ctx.clip();
      ctx.strokeStyle = 'rgba(226,232,240,0.35)';
      ctx.lineWidth = 3;
      const scroll = (now * 55) % 18;
      for (let d = -18 + scroll; d < len + 18; d += 18) {
        const px = a.x + (dx / len) * d;
        const py = a.y + (dy / len) * d;
        ctx.beginPath();
        ctx.moveTo(px + nx * half, py + ny * half);
        ctx.lineTo(px - nx * half, py - ny * half);
        ctx.stroke();
      }
      ctx.restore();

      // Rails
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(a.x + nx * half, a.y + ny * half);
      ctx.lineTo(b.x + nx * half, b.y + ny * half);
      ctx.moveTo(a.x - nx * half, a.y - ny * half);
      ctx.lineTo(b.x - nx * half, b.y - ny * half);
      ctx.stroke();

      // Intake hopper
      ctx.fillStyle = '#1e293b';
      roundRect(a.x - 14, a.y - 8, 28, 16, 4);
      ctx.fill();
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 1.5;
      roundRect(a.x - 14, a.y - 8, 28, 16, 4);
      ctx.stroke();

      // Register chute under stall
      ctx.fillStyle = '#0f172a';
      roundRect(BELT.sink.x - 16, BELT.sink.y - 6, 32, 18, 5);
      ctx.fill();
      ctx.strokeStyle = 'rgba(253,224,71,0.65)';
      ctx.lineWidth = 1.5;
      roundRect(BELT.sink.x - 16, BELT.sink.y - 6, 32, 18, 5);
      ctx.stroke();
    }

    function drawConveyGems() {
      const list = state.convey;
      if (!list.length) return;
      list.forEach((c) => {
        const p = conveyPos(c);
        let scale = 1;
        if (c.phase === 'hop') {
          const u = Math.min(1, c.t / CONVEY_HOP);
          scale = 0.85 + 0.2 * Math.sin(u * Math.PI);
        } else if (c.phase === 'drop') {
          const u = Math.min(1, c.t / CONVEY_DROP);
          scale = 1 - 0.35 * u;
        }
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(p.x + 1, p.y + 6, 8 * scale, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.save();
        ctx.translate(p.x, p.y);
        paintGem(c.kind, 13 * scale, c.seed, null);
        ctx.restore();
      });
    }

    function drawBills() {
      const bills = state.bills;
      if (!bills.length) return;
      const n = bills.length;
      const now = performance.now() / 1000;

      // Base shadow under the standing tower
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(CASH_ANCHOR.x, CASH_ANCHOR.y + 6, 18 + Math.min(10, n * 0.15), 7, 0, 0, Math.PI * 2);
      ctx.fill();

      bills.forEach((b, i) => {
        const p = billDrawPos(b, i);
        const bob = b.fly ? 0 : Math.sin(now * 3.2 + i * 0.35) * 0.8;
        ctx.save();
        ctx.translate(p.x, p.y + bob);
        if (p.flying) {
          const tilt = Math.sin((b.fly.t < 0 ? 0 : b.fly.t) * Math.PI) * 0.35;
          ctx.rotate(tilt);
        }
        // Bill — flat green note, stacked like gem plates
        const g = ctx.createLinearGradient(-18, -6, 18, 6);
        if (b.wanted) {
          g.addColorStop(0, '#fbcfe8');
          g.addColorStop(0.5, '#f472b6');
          g.addColorStop(1, '#db2777');
        } else {
          g.addColorStop(0, '#bbf7d0');
          g.addColorStop(0.5, '#4ade80');
          g.addColorStop(1, '#15803d');
        }
        ctx.fillStyle = g;
        roundRect(-18, -7, 36, 14, 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        // Center seal
        ctx.fillStyle = b.wanted ? 'rgba(131,24,67,0.55)' : 'rgba(20,83,45,0.55)';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '800 8px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('$', 0, 3);
        ctx.textAlign = 'left';
        ctx.restore();
      });

      // Total on top of tower
      if (n > 0) {
        const top = billDrawPos(bills[n - 1], n - 1);
        const sum = bills.reduce((a, b) => a + b.value, 0);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        roundRect(top.x - 22, top.y - 28, 44, 18, 8);
        ctx.fill();
        ctx.fillStyle = '#fde68a';
        ctx.font = '800 13px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(sum + '', top.x, top.y - 15);
        ctx.textAlign = 'left';
      }
    }

    function drawMarkedSeg(x1, y1, x2, y2, arrows, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const dx = x2 - x1, dy = y2 - y1;
      const L = Math.hypot(dx, dy) || 1;
      const ux = dx / L, uy = dy / L;
      const px = -uy, py = ux;
      for (let i = 0; i < arrows; i++) {
        const along = (i - (arrows - 1) / 2) * 5.5;
        const ax = mx + ux * along, ay = my + uy * along;
        ctx.beginPath();
        ctx.moveTo(ax - ux * 3.5 + px * 5, ay - uy * 3.5 + py * 5);
        ctx.lineTo(ax + ux * 2.5, ay + uy * 2.5);
        ctx.lineTo(ax - ux * 3.5 - px * 5, ay - uy * 3.5 - py * 5);
        ctx.stroke();
      }
    }

    // Geometry property signs on machines — never preview the output gem shape.
    // parallel: one pair ∥ · adjacent: ^ equal arms · right: right angle
    function drawMachineSign(id, cx, cy, on, scale) {
      const s = scale || 1;
      const col = on
        ? (id === 'right' ? '#fbbf24' : id === 'adjacent' ? '#c4b5fd' : '#5eead4')
        : 'rgba(148,163,184,0.45)';
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(s, s);

      if (id === 'trapezoid' || id === 'parallel') {
        // One pair of parallels — this machine's first cut makes a trapezoid
        drawMarkedSeg(-18, -7, 18, -7, 1, col);
        drawMarkedSeg(-18, 7, 18, 7, 1, col);
      } else if (id === 'adjacent') {
        // Peak (^) of two adjacent equal sides, with matching ticks
        ctx.strokeStyle = col;
        ctx.lineWidth = 2.8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(-15, 10);
        ctx.lineTo(0, -13);
        ctx.lineTo(15, 10);
        ctx.stroke();
        ctx.lineWidth = 2.3;
        ctx.beginPath();
        ctx.moveTo(-11.2, -4.6);
        ctx.lineTo(-4.2, 0.4);
        ctx.moveTo(11.2, -4.6);
        ctx.lineTo(4.2, 0.4);
        ctx.stroke();
      } else if (id === 'right') {
        // Right-angle mark
        ctx.strokeStyle = col;
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(-10, 12);
        ctx.lineTo(-10, -12);
        ctx.lineTo(12, -12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-10, -4);
        ctx.lineTo(-2, -4);
        ctx.lineTo(-2, -12);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawRuneEqual(x, y, on) {
      drawMachineSign('adjacent', x, y, on, 0.55);
    }

    function drawRuneRight(x, y, on) {
      drawMachineSign('right', x, y, on, 0.55);
    }

    function drawRuneTrap(x, y, on) {
      drawMachineSign('trapezoid', x, y, on, 0.55);
    }

    function drawShelfBoard(pad, hot) {
      // Raised wooden display shelf — planks + front lip for depth.
      ctx.fillStyle = 'rgba(20,12,6,0.4)';
      roundRect(pad.x + 3, pad.y + pad.h - 4, pad.w, 8, 4);
      ctx.fill();

      const grad = ctx.createLinearGradient(pad.x, pad.y, pad.x, pad.y + pad.h);
      grad.addColorStop(0, hot ? '#a06a38' : '#7a4e28');
      grad.addColorStop(0.5, hot ? '#6e4220' : '#553318');
      grad.addColorStop(1, '#3d2610');
      ctx.fillStyle = grad;
      roundRect(pad.x, pad.y, pad.w, pad.h, 8);
      ctx.fill();

      // Plank lines
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const y = pad.y + (pad.h * i) / 4;
        ctx.beginPath();
        ctx.moveTo(pad.x + 6, y);
        ctx.lineTo(pad.x + pad.w - 6, y);
        ctx.stroke();
      }

      // Front lip
      ctx.fillStyle = hot ? '#c4894a' : '#8a5a30';
      roundRect(pad.x + 2, pad.y + pad.h - 10, pad.w - 4, 9, 3);
      ctx.fill();
      ctx.strokeStyle = hot ? 'rgba(253,230,138,0.75)' : 'rgba(180,140,80,0.4)';
      ctx.lineWidth = 2;
      roundRect(pad.x, pad.y, pad.w, pad.h, 8);
      ctx.stroke();
    }

    function drawCostBadge(cx, cy, cost, can, locked) {
      if (locked) {
        ctx.fillStyle = 'rgba(30, 28, 36, 0.85)';
        roundRect(cx - 28, cy - 18, 56, 36, 10);
        ctx.fill();
        ctx.strokeStyle = 'rgba(148,163,184,0.45)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.font = '800 20px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('🔒', cx, cy + 7);
        ctx.textAlign = 'left';
        return;
      }
      const label = String(cost);
      ctx.font = '800 24px Outfit, sans-serif';
      const tw = ctx.measureText(label).width;
      const bw = Math.max(88, tw + 52);
      const bh = 40;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      roundRect(cx - bw / 2 + 3, cy - bh / 2 + 4, bw, bh, 12);
      ctx.fill();
      const g = ctx.createLinearGradient(cx, cy - bh / 2, cx, cy + bh / 2);
      if (can) {
        g.addColorStop(0, '#ffe9a8');
        g.addColorStop(0.45, '#f0c36a');
        g.addColorStop(1, '#c9922e');
      } else {
        g.addColorStop(0, '#fda4af');
        g.addColorStop(1, '#e11d48');
      }
      ctx.fillStyle = g;
      roundRect(cx - bw / 2, cy - bh / 2, bw, bh, 12);
      ctx.fill();
      ctx.strokeStyle = can ? 'rgba(255,251,235,0.9)' : 'rgba(255,228,230,0.75)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = can ? '#f59e0b' : '#fb7185';
      ctx.beginPath();
      ctx.arc(cx - bw / 2 + 20, cy, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = can ? '#78350f' : '#9f1239';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = can ? '#78350f' : '#fff';
      ctx.font = '800 14px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('$', cx - bw / 2 + 20, cy + 5);

      ctx.fillStyle = can ? '#422006' : '#fff1f2';
      ctx.font = '800 24px Outfit, sans-serif';
      ctx.fillText(label, cx + 10, cy + 8);
      ctx.textAlign = 'left';
    }

          counter: '#e8b868', counterEdge: 'rgba(255,236,190,0.55)',
