<!doctype html>
<html lang="ko">

<title>냥셰프의 닮음 주방 - 장면 시안</title>
<style>
html,body{margin:0;height:100%;background:#2b1b10;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
svg{width:100%;height:100%;max-width:calc(100vh*1.6);max-height:calc(100vw/1.6);display:block}
text{font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
#tog{position:fixed;right:14px;bottom:14px;z-index:5;border:0;border-radius:14px;padding:12px 18px;font:700 16px 'Malgun Gothic',sans-serif;background:#ff8a3d;color:#fff;box-shadow:0 4px 0 #c9631f;cursor:pointer}
#ann{display:none}
#ann.on{display:block}
.steam circle{animation:rise 2.4s infinite ease-out;opacity:0}
.steam circle:nth-child(2){animation-delay:.8s}.steam circle:nth-child(3){animation-delay:1.6s}
@keyframes rise{0%{transform:translateY(0);opacity:.0}20%{opacity:.5}100%{transform:translateY(-50px);opacity:0}}
.fall{animation:fall 2.2s infinite ease-in}
.fall:nth-of-type(2){animation-delay:.3s}.fall:nth-of-type(3){animation-delay:.6s}
@keyframes fall{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}60%{transform:translateY(0);opacity:1}100%{transform:translateY(6px);opacity:0}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.glow{animation:glow 1.4s infinite alternate}
@keyframes glow{from{opacity:.65}to{opacity:1}}
.bob{animation:bob 2.6s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-5px)}}
</style>
</head>

<script type="text/javascript"><![CDATA[
function giantCat(x,y,r,fur,belly,extra){
  var s='<g transform="translate('+x+','+y+')" filter="url(#sh)">';
  s+='<rect x="'+(-r*1.05)+'" y="'+(r*0.55)+'" width="'+(r*2.1)+'" height="'+(r*1.2)+'" rx="'+(r*0.5)+'" fill="'+fur+'"/>';
  s+='<ellipse cx="0" cy="'+(r*0.95)+'" rx="'+(r*0.55)+'" ry="'+(r*0.45)+'" fill="'+belly+'"/>';
  s+='<polygon points="'+(-r*0.95)+','+(-r*0.25)+' '+(-r*0.75)+','+(-r*1.25)+' '+(-r*0.15)+','+(-r*0.85)+'" fill="'+fur+'"/>';
  s+='<polygon points="'+(r*0.95)+','+(-r*0.25)+' '+(r*0.75)+','+(-r*1.25)+' '+(r*0.15)+','+(-r*0.85)+'" fill="'+fur+'"/>';
  s+='<polygon points="'+(-r*0.78)+','+(-r*0.45)+' '+(-r*0.68)+','+(-r*0.98)+' '+(-r*0.35)+','+(-r*0.75)+'" fill="#ffb3c1"/>';
  s+='<polygon points="'+(r*0.78)+','+(-r*0.45)+' '+(r*0.68)+','+(-r*0.98)+' '+(r*0.35)+','+(-r*0.75)+'" fill="#ffb3c1"/>';
  s+='<ellipse cx="0" cy="0" rx="'+(r*1.05)+'" ry="'+(r*0.9)+'" fill="'+fur+'"/>';
  s+=(extra||'');
  s+='<g class="blink" style="transform-origin:0 '+(-r*0.1)+'px"><ellipse cx="'+(-r*0.4)+'" cy="'+(-r*0.1)+'" rx="'+(r*0.12)+'" ry="'+(r*0.17)+'" fill="#3b2a1a"/><ellipse cx="'+(r*0.4)+'" cy="'+(-r*0.1)+'" rx="'+(r*0.12)+'" ry="'+(r*0.17)+'" fill="#3b2a1a"/></g>';
  s+='<polygon points="'+(-r*0.09)+','+(r*0.1)+' '+(r*0.09)+','+(r*0.1)+' 0,'+(r*0.22)+'" fill="#ff8fa6"/>';
  s+='<path d="M0 '+(r*0.22)+' q'+(-r*0.15)+' '+(r*0.15)+' '+(-r*0.3)+' 0 M0 '+(r*0.22)+' q'+(r*0.15)+' '+(r*0.15)+' '+(r*0.3)+' 0" stroke="#3b2a1a" stroke-width="3" fill="none" stroke-linecap="round"/>';
  [[-1,-0.02],[-1,0.1],[1,-0.02],[1,0.1]].forEach(function(v){s+='<line x1="'+(v[0]*r*0.35)+'" y1="'+(r*(0.14+v[1]))+'" x2="'+(v[0]*r*0.95)+'" y2="'+(r*(0.08+v[1]*2))+'" stroke="#3b2a1a" stroke-width="2.5" stroke-linecap="round"/>'});
  s+='<ellipse cx="'+(-r*0.62)+'" cy="'+(r*0.2)+'" rx="'+(r*0.16)+'" ry="'+(r*0.09)+'" fill="#ffb3c1" opacity=".7"/><ellipse cx="'+(r*0.62)+'" cy="'+(r*0.2)+'" rx="'+(r*0.16)+'" ry="'+(r*0.09)+'" fill="#ffb3c1" opacity=".7"/>';
  return s+'</g>';
}
/* 주문 말풍선 : 원본 → 거인 크기 */
function dishMini(x,y,w,h,pal,ears){
  var s='';
  if(ears)s+='<polygon points="'+(x+w*0.08)+','+y+' '+(x+w*0.2)+','+(y-h*0.28)+' '+(x+w*0.34)+','+y+'" fill="'+pal[0]+'"/><polygon points="'+(x+w*0.66)+','+y+' '+(x+w*0.8)+','+(y-h*0.28)+' '+(x+w*0.92)+','+y+'" fill="'+pal[0]+'"/>';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(Math.min(w,h)*0.12)+'" fill="'+pal[0]+'" stroke="#8a5a2b" stroke-width="2"/>';
  s+='<rect x="'+(x+w*0.08)+'" y="'+(y+h*0.08)+'" width="'+(w*0.84)+'" height="'+(h*0.84)+'" rx="'+(Math.min(w,h)*0.08)+'" fill="'+pal[1]+'"/>';
  s+='<circle cx="'+(x+w*0.3)+'" cy="'+(y+h*0.4)+'" r="'+(w*0.045)+'" fill="#3b2a1a"/><circle cx="'+(x+w*0.7)+'" cy="'+(y+h*0.4)+'" r="'+(w*0.045)+'" fill="#3b2a1a"/>';
  return s;
}
function bubble(x,y,k,pal,name,pct,low){
  var u=26,s='<g transform="translate('+x+','+y+')" filter="url(#sh)">';
  s+='<rect width="300" height="150" rx="22" fill="#fff" stroke="#ead6b4" stroke-width="3"/><polygon points="40,148 70,148 40,176" fill="#fff" stroke="#ead6b4" stroke-width="3"/><rect x="38" y="145" width="34" height="6" fill="#fff"/>';
  s+='<text x="16" y="30" font-size="15" font-weight="700" fill="#8a6a45">'+name+'</text>';
  s+='<text x="284" y="32" text-anchor="end" font-size="23" font-weight="800" fill="#c9631f">닮음비 1 : '+k+'</text>';
  s+=dishMini(24,104-u,u,u,pal,true);
  s+='<text x="24" y="122" font-size="12" font-weight="700" fill="#8a6a45">원본</text>';
  s+='<text x="88" y="98" font-size="26" font-weight="800" fill="#3b2a1a">→</text>';
  s+=dishMini(140,126-u*k*0.85,u*k*0.85,u*k*0.85,pal,true);
  s+='<text x="284" y="122" text-anchor="end" font-size="13" font-weight="700" fill="#8a6a45">거인 크기로!</text>';
  s+='</g>';
  return s;
}
function pbar(x,y,pct,low){
  return '<g transform="translate('+x+','+y+')"><rect width="160" height="12" rx="6" fill="#f0dfc0"/><rect width="'+(160*pct)+'" height="12" rx="6" fill="'+(low?'#d94b43':'#5fbf82')+'"/></g>';
}
var P_PIZZA=['#e2a85f','#d9553f'],P_CAKE=['#f1c9a5','#fff0d6'];
var h='';
h+=giantCat(210,330,88,'#f2a65a','#fff3e0');
h+=bubble(70,60,2,P_PIZZA,'냥 피자 주문',0.8,false);
h+=pbar(130,432,0.72,false).replace('translate(130,432)','translate(130,410)');
h+=giantCat(640,350,80,'#9aa3ad','#f1f3f5');
h+=bubble(500,72,3,P_CAKE,'냥 케이크 주문',0.4,true).replace('translate(500,72)','translate(720,80)');
h+='<g transform="translate(560,418)"><rect width="160" height="12" rx="6" fill="#f0dfc0"/><rect width="64" height="12" rx="6" fill="#d94b43"/></g>';
/* 빈 자리 */
h+='<g opacity=".5"><ellipse cx="1100" cy="380" rx="60" ry="14" fill="#8a5a2b"/><rect x="1075" y="300" width="50" height="80" rx="10" fill="#a8703e"/><text x="1100" y="345" text-anchor="middle" font-size="32">🪑</text></g>';
document.currentScript.parentNode.insertAdjacentHTML('beforeend',h);
]]></script>
