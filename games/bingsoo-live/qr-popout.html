<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세션 QR</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      user-select: none;
    }
    .qr-app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 10px 14px;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .qr-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex: none;
    }
    .qr-badge {
      font-size: 0.85rem;
      font-weight: 800;
      color: #0284c7;
      background: #e0f2fe;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .qr-badge strong {
      letter-spacing: 0.1em;
      color: #0369a1;
    }
    .size-chips {
      display: flex;
      gap: 4px;
    }
    .size-btn {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.76rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .size-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .size-btn.active {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
    }
    .qr-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .qr-img-wrapper {
      background: #ffffff;
      padding: 10px;
      border-radius: 16px;
      border: 2px solid #e2e8f0;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.18s ease, height 0.18s ease;
    }
    .qr-img {
      display: block;
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 8px;
    }
    .qr-footer {
      width: 100%;
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .qr-desc {
      font-size: 0.78rem;
      color: #64748b;
      font-weight: 600;
      text-align: center;
    }
    .qr-desc strong {
      color: #0284c7;
    }
    .qr-zoom-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 290px;
    }
    .zoom-step-btn {
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
    }
    .zoom-step-btn:hover {
      background: #cbd5e1;
    }
    .zoom-slider {
      flex: 1;
      accent-color: #0284c7;
      cursor: pointer;
      height: 6px;
    }
    .qr-popout-error {
      color: #dc2626;
      font-weight: 700;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="qr-app" id="qr-app">
    <div class="qr-header">
      <span class="qr-badge">세션 코드 <strong id="qr-code">————</strong></span>
      <div class="size-chips" id="size-chips"></div>
    </div>
    <div class="qr-stage">
      <div class="qr-img-wrapper" id="qr-img-wrapper">
        <img id="qr-img" class="qr-img" alt="학생용 입장 QR">
      </div>
    </div>
    <div class="qr-footer">
      <p class="qr-desc">학생이 카메라로 찍으면 <strong>바로 게임에 들어갑니다.</strong></p>
      <div class="qr-zoom-bar">
        <button type="button" class="zoom-step-btn" id="btn-zoom-out" title="QR 축소">−</button>
        <input type="range" class="zoom-slider" id="zoom-slider" min="160" max="600" step="10" value="300" title="QR 크기 조정">
        <button type="button" class="zoom-step-btn" id="btn-zoom-in" title="QR 확대">+</button>
      </div>
    </div>
  </div>
  <script src="qr-popout.js"></script>
</body>
</html>
