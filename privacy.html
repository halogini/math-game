  <style>
    body { font-family: 'Pretendard', sans-serif; padding: 30px; line-height: 1.6; background-color: #f8fafc; color: #1e293b; max-width: 800px; margin: 0 auto; }
    h1 { color: #0284c7; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; }
  </style>

<body>
  <h1>🔒 할로매쓰 (HaloMath) 개인정보처리방침</h1>
  <div class="box">
    <p><strong>1. 수집 항목</strong>: 플레이어 이름(또는 닉네임), 학번(학교 모드 이용 시에 한함)</p>
    <p><strong>2. 수집 목적</strong>: 미니 게임 명예의 전당 랭킹 등록 및 리더보드 게시</p>
    <p><strong>3. 정보 격리 보호</strong>: 일반/커뮤니티 모드 이용자는 학번 정보를 일절 수집하지 않으며, 학교 학생 데이터와 철저하게 분리되어 안전하게 보호됩니다.</p>
    <p><strong>4. 보유 및 이용 기간</strong>: 서비스 제공 기간 내 보유하며, 이용자의 삭제 요청 시 즉시 파기됩니다.</p>
  </div>
